          "text": " drops from the workbench onto the floor with a thud and walks directly over the "
        },
        {
          "text": "recipe",
          "entity": "recipe"
        },
        {
          "text": ", leaving a small muddy pawprint on the "
        },
        {
          "text": "mushroom",
          "entity": "mushroom"
        },
        {
          "text": " entry.\n\nYou push her off.\n\nThe "
        },
        {
          "text": "moon-clock",
          "entity": "moonClock"
        },
        {
          "text": " ticks.\n\nThe "
        },
        {
          "text": "Underbog",
          "entity": "underbog"
        },
        {
          "text": " is thirty yards away. You have a folding knife, a candle, and twenty-seven days. The cowardly part of you, which is currently all of you, would very much like a plan before you open the back door."
        }
      ],
      "choices": [
        {
          "label": "Grab the biggest iron pot from beside the hearth and head straight out the back door into the Underbog, figuring speed is better protection than caution.",
          "target": "n0_0"
        },
        {
          "label": "Lash your folding knife to the end of your broom handle with a strip of leather so you can cut the mushroom from a distance without wading in close to the eels.",
          "target": "n0_1"
        },
        {
          "label": "Go down to the root cellar first and retrieve the dried viper thistle, reasoning that securing one ingredient now is better than risking the Underbog unprepared.",
          "target": "n0_2"
        }
      ]
    },
    "n1_0_0": {
      "content": [
        {
          "text": "You move before the fear can catch up with you.\n\nThe rain has softened to a mist by the time you reach the "
        },
        {
          "text": "Deep Channel",
          "entity": "deepChannel"
        },
        {
          "text": ", tubing coiled over one shoulder, vial corked in your pocket. The water runs dark and fast between the rock shelves. You crouch at the edge and wait, breathing through your nose, watching the current.\n\nThe "
        },
        {
          "text": "White Eel",
          "entity": "whiteEel"
        },
        {
          "text": " comes to you. It slides into the shallows as if curious, pale body luminous beneath the amber water, blue veins branching like river maps under its skin. You feed the pipette down along a submerged root. Your hands do not shake. They simply do the work.\n\nThe "
        },
        {
          "text": "venom",
          "entity": "eelVenom"
        },
        {
          "text": " fills the vial in three slow heartbeats.\n\nYou cork it, stand, and realize you are soaking wet to the knee and completely fine.\n\nIt takes you eleven more days to gather the rest. Some go badly. None kill you. On the twelfth evening you brew the antidote by lamplight with "
        },
        {
          "text": "Scoria",
          "entity": "scoria"
        },
        {
          "text": " purring on the windowsill, and when you drink it the gold comes home like a door closing softly against the cold."
        }
      ],
      "choices": [],
      "ending": {
        "tag": "WIN",
        "subtag": ""
      }
    },
    "n1_0_1": {
      "content": [
        {
          "text": "You fold the note carefully, seal it with a drip of beeswax, and send "
        },
        {
          "text": "Dorrit Fenn",
          "entity": "dorrit"
        },
        {
          "text": " to deliver it. Then you wait.\n\n"
        },
        {
          "text": "Thessaly Grieve",
          "entity": "thessaly"
        },
        {
          "text": " does not respond the first day. Or the second. On the third morning a reply arrives in the elder's slow, looping hand: the "
        },
        {
          "text": "Circle",
          "entity": "circleHall"
        },
        {
          "text": " will convene at the new moon to review the matter. Eleven days from now. You may not proceed without sanction.\n\nYou wait. The "
        },
        {
          "text": "moon-clock",
          "entity": "moonClock"
        },
        {
          "text": " ticks. You draft careful arguments. You sleep badly.\n\nThe "
        },
        {
          "text": "Circle",
          "entity": "circleHall"
        },
        {
          "text": " meets. They deliberate. "
        },
        {
          "text": "Cull Redmarsh",
          "entity": "cull"
        },
        {
          "text": " clears his throat and says self-extraction without supervision is a recklessness the "
        },
        {
          "text": "Circle",
          "entity": "circleHall"
        },
        {
          "text": " cannot formally condone. The discussion continues until past midnight. "
        },
        {
          "text": "Neave Ashpool",
          "entity": "neave"
        },
        {
          "text": " abstains. No sanction is granted.\n\nYou ride home through the rain with nine days remaining. The "
        },
        {
          "text": "eel venom",
          "entity": "eelVenom"
        },
        {
          "text": " still needs harvesting. The "
        },
        {
          "text": "caves",
          "entity": "caves"
        },
        {
          "text": " and the bog and the bridge are still out there.\n\nBut the "
        },
        {
          "text": "moon-clock",
          "entity": "moonClock"
        },
        {
          "text": " has no patience for committee work. When the final hour turns, the gold in "
        },
        {
          "text": "the bottle",
          "entity": "courageBottle"
        },
        {
          "text": " goes dark, and you feel nothing where your courage used to live. Nothing at all. Forever."
        }
      ],
      "choices": [],
      "ending": {
        "tag": "LOSS",
        "subtag": ""
      }
    },
    "n1_0_2": {
      "content": [
        {
          "text": "The stick holds. You find that out on your knees at the riverbank in the gray afternoon rain, arm extended, the glass tip pressed against the jaw of a mottled eel you have somehow cornered against a submerged rock. The eel thrashes. You hold the stick with both hands, fingers white, and the "
        },
        {
          "text": "venom",
          "entity": "eelVenom"
        },
        {
          "text": " travels up the tubing anyway, slow and clear, and pools in the vial.\n\nYou cork the vial before you stand up. You do not look at the water again.\n\nThe other ingredients take eleven more days. Bridge "
        },
        {
          "text": "silk",
          "entity": "spiderSilk"
        },
        {
          "text": ", collected at dawn when the spiders are sluggish. "
        },
        {
          "text": "Crystal",
          "entity": "phosphite"
        },
        {
          "text": " dust, scraped by hand in the cave dark while bats wheel overhead. "
        },
        {
          "text": "Thistle",
          "entity": "thistle"
        },
        {
          "text": " root dug from a cold hillside. "
        },
        {
          "text": "Mushroom",
          "entity": "mushroom"
        },
        {
          "text": " cut in the "
        },
        {
          "text": "Underbog",
          "entity": "underbog"
        },
        {
          "text": " with your boots soaked through and your heart loud in your ears the whole time.\n\nThe antidote brews for six hours. It tastes of iron and relief.\n\nWhen the warmth floods back into your chest, "
        },
        {
          "text": "Scoria",
          "entity": "scoria"
        },
        {
          "text": " immediately sits on your feet."
        }
      ],
      "choices": [],
      "ending": {
        "tag": "WIN",
        "subtag": ""
      }
    },
    "n1_0_3": {
      "content": [
        {
          "text": "You uncork the anxiety and pour it in a thin line from your doorstep down to the riverbank, the gray-green liquid soaking into the mud and grass. Then you crouch at the water's edge with your tubing assembly and wait.\n\nSomething comes.\n\nSeveral somethings. The anxiety doesn't draw one eel into the shallows. It draws a dozen, churning up from the "
        },
        {
          "text": "Deep Channel",
          "entity": "deepChannel"
        },
        {
          "text": " in a pale writhing mass, agitated and hungry and moving fast. You scramble backward but your boot catches in the razor-sedge and you go down hard on the bank, the tubing flying from your hands into the current.\n\nThe eels pour over the mud toward the scent. One finds your ankle.\n\nThe "
        },
        {
          "text": "venom",
          "entity": "eelVenom"
        },
        {
          "text": " enters your blood.\n\nYou wake in the dark, paralyzed from the knee down, the "
        },
        {
          "text": "moon-clock",
          "entity": "moonClock"
        },
        {
          "text": " somewhere far away ticking toward a deadline your numbed body cannot meet. The "
        },
        {
          "text": "courage bottle",
          "entity": "courageBottle"
        },
        {
          "text": " glows gold on its shelf at home, warm and patient and entirely alone."
        }
      ],
      "choices": [],
      "ending": {
        "tag": "LOSS",
        "subtag": ""
      }
    },
    "n1_0": {
      "content": [
        {
          "text": "You unroll the "
        },
        {
          "text": "extraction kit",
          "entity": "extractionKit"
        },
        {
          "text": " on the workbench and line up every piece beside the "
        },
        {
          "text": "recipe",
          "entity": "recipe"
        },
        {
          "text": ". The pipettes are glass, narrow, the longest just over a foot. Not long enough to reach a submerged eel without your hand following it into the water.\n\n"
        },
        {
          "text": "Scoria",
          "entity": "scoria"
        },
        {
          "text": " shifts her weight on the shelf above, and a coil of spare tubing you had entirely forgotten rolls off the edge and lands across your wrist.\n\nYou stare at it.\n\nIt is rubber tubing, six feet of it, bought two winters ago for a distillation rig you never finished building. One end fits snugly over the mouth of your longest pipette. The other end fits, with some persuasion, into the neck of your corked empty vial. You have just made a collection line long enough to keep your body several feet from anything with teeth.\n\nThe problem is that an eel does not hold still while you press glass to its jaw.\n\nYou will need the animal pinned, or lured close, or distracted. You will need to be at the riverbank regardless. But the difference between six feet and six inches is not nothing, and for the first time since the mouse this morning, your hands are steady.\n\nThe "
        },
        {
          "text": "moon-clock",
          "entity": "moonClock"
        },
        {
          "text": " ticks. Twenty-seven days. You have a tool. Now you need a plan for using it."
        }
      ],
      "choices": [
        {
          "label": "Take the tubing, the vial, and your folding knife to the Deep Channel now while the idea is still hot and your nerve holds.",
          "target": "n1_0_0"
        },
        {
          "label": "Write a careful note to Thessaly Grieve explaining your situation and requesting the Circle's sanction before you attempt anything near the river.",
          "target": "n1_0_1"
        },
        {
          "label": "Spend the next hour at the workbench securing the tubing to a long stick with strips cut from your satchel strap, testing the assembly until it feels solid before you go anywhere near water.",
          "target": "n1_0_2"
        },
        {
          "label": "Uncork a bottle of low-grade anxiety and pour a thin trail of it toward the river bank, hoping the scent will draw an eel into shallower, calmer water where you can work without wading in.",
          "target": "n1_0_3"
        }
      ]
    },
    "n1_1_0": {
      "content": [
        {
          "text": "Dorrit Fenn",
          "entity": "dorrit"
        },
        {
          "text": " is not in the village. She has gone to her aunt's in the next valley for a fortnight, the woman at the grain stall tells you, and she says it with the particular indifference of someone who can tell you are not well.\n\nYou walk back to the "
        },
        {
          "text": "cottage",
          "entity": "cottage"
        },
        {
          "text": " in the rain.\n\nTwenty-four days becomes twenty. Becomes fifteen. You try the "
        },
        {
          "text": "Underbog",
          "entity": "underbog"
        },
        {
          "text": " twice and make it as far as the treeline before your legs lock up and send you home. You send a note to "
        },
        {
          "text": "Thessaly Grieve",
          "entity": "thessaly"
        },
        {
          "text": " and then burn it before a messenger can carry it. You make another schedule. You tear it up too.\n\nOn the final morning, you sit beneath the "
        },
        {
          "text": "moon-clock",
          "entity": "moonClock"
        },
        {
          "text": " as it ticks to zero. The gold bottle on the shelf glows the same warm, steady light it has glowed from the beginning, patient as a candle.\n\nYou made it too well to break. That, you think, is the cruelest part."
        }
      ],
      "choices": [],
      "ending": {
        "tag": "LOSS",
        "subtag": ""
      }
    },
    "n1_1_1": {
      "content": [
        {
          "text": "The village is dark and the back door of "
        },
        {
          "text": "Harrow's Apothecary",
          "entity": "apothecary"
        },
        {
          "text": " is not locked, which should have told you something.\n\nYou make it three steps inside before your shin finds a low shelf and the crash of falling jars is enormous in the silence. You freeze. "
        },
        {
          "text": "Scoria",
          "entity": "scoria"
        },
        {
          "text": ", who followed you unbidden, does not freeze. She walks directly into the glass display case, which wobbles, and then tips.\n\nThe sound brings "
        },
        {
          "text": "Pidge Harrow",
          "entity": "pidge"
        },
        {
          "text": " down from his rooms above in under a minute, lamp in hand. He finds you crouched behind his counter, hands over your head, surrounded by broken glass and spilled copper compounds that are already staining your fingers green.\n\nHe does not call the "
        },
        {
          "text": "Circle",
          "entity": "circleHall"
        },
        {
          "text": ". He does not need to. He simply stands in the doorway, ledger under his arm, and looks at you the way a man looks at something he will be writing down.\n\nThe "
        },
        {
          "text": "moon-clock",
          "entity": "moonClock"
        },
        {
          "text": " at home is ticking. You have twenty-four days and no ground left to hide on."
        }
      ],
      "choices": [],
      "ending": {
        "tag": "LOSS",
        "subtag": ""
      }
    },
    "n1_1_2": {
      "content": [
        {
          "text": "Thessaly Grieve",
          "entity": "thessaly"
        },
        {
          "text": " opens the Hall door before you finish knocking. Her good eye takes one look at you and she steps aside without a word.\n\nYou tell her everything. The extraction, the mouse, the schedule, the two wasted days. Her twisted hands rest on her blackthorn stick and she listens without interrupting, which is worse than if she had.\n\nWhen you finish, she is quiet for a long moment.\n\n\"Twenty-four days,\" she says.\n\n\"Yes.\"\n\n\"You came to me on day three.\"\n\nYou say nothing.\n\nShe does not shout. She simply tells you, in the same slow careful voice she uses for everything, that the "
        },
        {
          "text": "Circle",
          "entity": "circleHall"
        },
        {
          "text": " cannot intervene in self-inflicted extractions. Guild policy. The liability is too broad. She is sorry. She means it, which is the cruelest part.\n\nYou walk home in the rain. The "
        },
        {
          "text": "moon-clock",
          "entity": "moonClock"
        },
        {
          "text": " ticks. The gold bottle glows on the shelf, patient and permanent, and you sit down on the floor beside your cold "
        },
        {
          "text": "cauldron",
          "entity": "cauldron"
        },
        {
          "text": " and wait for a courage that is no longer coming."
        }
      ],
      "choices": [],
      "ending": {
        "tag": "LOSS",
        "subtag": ""
      }
    },
    "n1_1": {
      "content": [
        {
          "text": "The schedule looks impressive on paper. Two full sides of a torn sheet, columns ruled with a straight-edge, ingredient windows color-coded by danger level. It took three hours. The "
        },
        {
          "text": "moon-clock",
          "entity": "moonClock"
        },
        {
          "text": " has ticked three more times.\n\nYou sit back and look at it and feel nothing useful. Because the schedule says \"Day 3: "
        },
        {
          "text": "Underbog",
          "entity": "underbog"
        },
        {
          "text": ", "
        },
        {
          "text": "heartblood mushroom",
          "entity": "mushroom"
        },
        {
          "text": "\" and your body already knows that when Day 3 arrives, it will feel exactly as today feels. Which is: bad.\n\nA schedule is a map of a country you cannot make your legs enter.\n\n"
        },
        {
          "text": "Scoria",
          "entity": "scoria"
        },
        {
          "text": " butts her head once against your ankle, which is the most comfort she has ever voluntarily offered. You pick her up. She tolerates this for four seconds, then squirms free and sits facing the door.\n\nYou count the days lost. You extracted on Day One. The schedule-writing swallowed Day Two and half of Day Three. Twenty-four days remain. The "
        },
        {
          "text": "cottage",
          "entity": "cottage"
        },
        {
          "text": " still has seven locks on the door and all of them are engaged and you are the one who engaged them.\n\nPlanning is not the same as moving. You know this. You have always known this. The question is whether you solve this alone, inside these four stone walls, or whether you admit that without your courage, you need a different kind of resource entirely."
        }
      ],
      "choices": [
        {
          "label": "Tear up the schedule and go find Dorrit Fenn in the village, offering her a full week's errand-pay to gather whichever ingredients keep her out of serious danger while you handle the rest.",
          "target": "n1_1_0"
        },
        {
          "label": "Wait until the village goes dark, then slip into Harrow's Apothecary through the back and see whether Pidge keeps any of the five ingredients in his stockroom.",
          "target": "n1_1_1"
        },
        {
          "label": "Unlock the door, walk to the Bottlers' Circle Hall, and tell Thessaly Grieve exactly what you did to yourself, trusting that the Circle's elder has seen worse mistakes and knows how to fix them.",
          "target": "n1_1_2"
        }
      ]
    },
    "n1": {
      "content": [
        {
          "text": "You drag the iron crossbeam into its bracket and feel marginally better for it. Logic, you tell yourself. Think logically. The "
        },
        {
          "text": "recipe",
          "entity": "recipe"
        },
        {
          "text": " calls for five ingredients because each one carries a specific property. Emotions are properties. You have forty bottles on these shelves.\n\nYou pull down three candidates: a bottle of low-grade anxiety, one of heartsickness, and a nostalgia. You spread them on the workbench beside the "
        },
        {
          "text": "recipe",
          "entity": "recipe"
        },
        {
          "text": " and stare at the faded ink. "
        },
        {
          "text": "Eel venom",
          "entity": "eelVenom"
        },
        {
          "text": " stabilizes the base compound with its numbing agent. "
        },
        {
          "text": "Bridge-spider silk",
          "entity": "spiderSilk"
        },
        {
          "text": " acts as a binding matrix. The "
        },
        {
          "text": "recipe",
          "entity": "recipe"
        },
        {
          "text": " is not metaphorical. It is chemistry. These are not interchangeable.\n\nYou try anyway.\n\nYou measure half a pipette of anxiety into a test vial, add water, apply heat. The gray-green liquid turns the water murky and then separates completely, floating in an oily ring at the surface. You try the nostalgia. It smells briefly of someone else's childhood and then evaporates in a faint amber mist, leaving nothing.\n\n"
        },
        {
          "text": "Scoria",
          "entity": "scoria"
        },
        {
          "text": " watches from the workbench with the expression of a creature who knew this would happen.\n\nThe vials are empty. The "
        },
        {
          "text": "recipe",
          "entity": "recipe"
        },
        {
          "text": " is unchanged. You have lost perhaps two hours and a quarter-bottle of nostalgia, and the "
        },
        {
          "text": "moon-clock",
          "entity": "moonClock"
        },
        {
          "text": " has ticked twice.\n\nYou sit very still for a moment, listening to the rain. Your hands are not shaking quite as badly as they were this morning. Maybe that is something. Maybe you are becoming accustomed to your own terror the way you become accustomed to a bad smell.\n\nThe five ingredients are still out there. You have to think harder about how to reach them."
        }
      ],
      "choices": [
        {
          "label": "Lay the recipe beside your extraction kit and work out whether any of your existing tools could let you harvest eel venom from a safe distance, without putting your hands near the water.",
          "target": "n1_0"
        },
        {
          "label": "Write out a day-by-day schedule for all twenty-seven days, assigning each ingredient its own window and building in rest days so you never have to face more than one danger at a time.",
          "target": "n1_1"
        }
      ]
    },
    "n2_0_0": {
      "content": [
        {
          "text": "The schedule takes two hours to write and looks very thorough and does absolutely nothing when a fox gets into the "
        },
        {
          "text": "root cellar",
          "entity": "cellar"
        },
        {
          "text": " at midnight and you spend forty minutes too terrified to go down the ladder after it.\n\nIn the morning, embarrassed and exhausted, you go to "
        },
        {
          "text": "Grathbone Bridge",
          "entity": "grathbone"
        },
        {
          "text": " anyway. Then the "
        },
        {
          "text": "caves",
          "entity": "caves"
        },
        {
          "text": ". Then the "
        },
        {
          "text": "Underbog",
          "entity": "underbog"
        },
        {
          "text": ", shaking the whole time, cutting heartblood mushrooms from a half-submerged log with eels circling your boots. You collect the "
        },
        {
          "text": "viper thistle",
          "entity": "thistle"
        },
        {
          "text": " root last, on a windswept hill with your eyes shut against the thorns.\n\nSix hours at the "
        },
        {
          "text": "cauldron",
          "entity": "cauldron"
        },
        {
          "text": ". The antidote comes out the color of pale dawn.\n\nYou drink it standing at the hearth. The warmth hits your chest and spreads outward, and you realize, with some surprise, that your hands have been steady for the last three days.\n\n"
        },
        {
          "text": "The bottle",
          "entity": "courageBottle"
        },
        {
          "text": " on the shelf still glows gold. You leave it there. You don't think you need it back just yet."
        }
      ],
      "choices": [],
      "ending": {
        "tag": "WIN",
        "subtag": ""
      }
    },
    "n2_0_1": {
      "content": [
        {
          "text": "Old Sable",
          "entity": "sable"
        },
        {
          "text": " is exactly where you expected her to be, tucked beneath her oilcloth awning with a spool between her stubby fingers, winding "
        },
        {
          "text": "silk",
          "entity": "spiderSilk"
        },
        {
          "text": " so fine it catches the gray light like smoke. She listens to your offer without interrupting. You have three copper pennies left and a bottle of low-grade anxiety from your "
        },
        {
          "text": "satchel",
          "entity": "satchel"
        },
        {
          "text": ". She takes the anxiety without comment and hands over a spool the size of your thumb.\n\n\"Helps me sleep,\" she says, and says nothing else.\n\nThe remaining days blur into a particular kind of exhaustion. The "
        },
        {
          "text": "Underbog",
          "entity": "underbog"
        },
        {
          "text": ". The "
        },
        {
          "text": "caves",
          "entity": "caves"
        },
        {
          "text": ". A windy hillside where you dig "
        },
        {
          "text": "viper thistle",
          "entity": "thistle"
        },
        {
          "text": " root with shaking hands, thorns raising welts across your wrists. Each ingredient is its own small catastrophe, survived mostly through stubbornness.\n\nOn the twenty-third day, you pour the finished antidote in. The gold bottle on the top shelf opens. The warmth floods back through your chest like a hearth lit after a long winter.\n\n"
        },
        {
          "text": "Scoria",
          "entity": "scoria"
        },
        {
          "text": " doesn't even look up."
        }
      ],
      "choices": [],
      "ending": {
        "tag": "WIN",
        "subtag": ""
      }
    },
    "n2_0_2": {
      "content": [
        {
          "text": "You send "
        },
        {
          "text": "Dorrit",
          "entity": "dorrit"
        },
        {
          "text": " at a run toward "
        },
        {
          "text": "Grathbone Bridge",
          "entity": "grathbone"
        },
        {
          "text": " with a penny and instructions, then take the southern track toward the "
        },
        {
          "text": "Underbog",
          "entity": "underbog"
        },
        {
          "text": " alone.\n\nThe ground softens under your boots within a hundred yards. Black water gleams between tussocks. You can hear the eels moving in the deep channels, soft displacements, patient and large. Your hands won't stop trembling.\n\nBut you move anyway. That is the thing you learn about courage in its absence: something else fills the gap. Stubbornness, maybe. Necessity. You wade to the fallen oak at the bog's center, cut three heartblood mushrooms with your folding knife, and wade back out without stopping to think about what is beneath your feet.\n\n"
        },
        {
          "text": "Dorrit",
          "entity": "dorrit"
        },
        {
          "text": " meets you at the track's edge, beaming, a spool of fine "
        },
        {
          "text": "silk",
          "entity": "spiderSilk"
        },
        {
          "text": " in her palm. "
        },
        {
          "text": "Old Sable",
          "entity": "sable"
        },
        {
          "text": " had three to spare.\n\nTwo ingredients in an afternoon. You head home. The "
        },
        {
          "text": "moon-clock",
          "entity": "moonClock"
        },
        {
          "text": " has twenty-six days left, and you are still moving."
        }
      ],
      "choices": [],
      "ending": {
        "tag": "WIN",
        "subtag": ""
      }
    },
    "n2_0": {
      "content": [
        {
          "text": "Pidge",
          "entity": "pidge"
        },
        {
          "text": " takes his time. He circles the display case, opens it with a small key on his watch chain, and sets the "
        },
        {
          "text": "eel venom",
          "entity": "eelVenom"
        },
        {
          "text": " vial on the counter. Then he crosses to your "
        },
        {
          "text": "satchel",
          "entity": "satchel"
        },
        {
          "text": " and considers your three bottles with the deliberate attention of a man who will be describing this transaction to customers for months.\n\nHe takes two bottles of nostalgia and one deep rose heartsickness without a word. You watch twelve pennies' worth of stock change hands and feel nothing about it. That is either pragmatism or a symptom of your condition.\n\n\"Pleasure,\" he says, and logs the trade in the ledger with his green-stained fingers.\n\nThe "
        },
        {
          "text": "venom",
          "entity": "eelVenom"
        },
        {
          "text": " vial sits in your coat pocket now, cool and slightly oily through the glass. One ingredient down. Four remaining. Outside the "
        },
        {
          "text": "apothecary",
          "entity": "apothecary"
        },
        {
          "text": ", the rain has softened to a drizzle. The village track forks ahead: left toward "
        },
        {
          "text": "Grathbone Bridge",
          "entity": "grathbone"
        },
        {
          "text": ", where "
        },
        {
          "text": "Old Sable",
          "entity": "sable"
        },
        {
          "text": " keeps her stone shelter and the red-marked spiders colonize the underside of the arch. Right, back toward the "
        },
        {
          "text": "cottage",
          "entity": "cottage"
        },
        {
          "text": " and the "
        },
        {
          "text": "Underbog",
          "entity": "underbog"
        },
        {
          "text": " beyond.\n\n"
        },
        {
          "text": "Dorrit Fenn",
          "entity": "dorrit"
        },
        {
          "text": " is sheltering under the butcher's eave across the lane, watching you with her gap-toothed grin, clearly available for hire.\n\nYou have the rest of the afternoon."
        }
      ],
      "choices": [

          "target": "n2_0_0"

        {

          "target": "n2_0_1"

        {

    "n2_1_0": {
      "content": [
        {
          "text": "Pidge",
          "entity": "pidge"
        },
        {
          "text": " looks at you for a long moment. Then he unrolls his "
        },
        {
          "text": "extraction kit",
          "entity": "extractionKit"
        },
        {
          "text": " from beneath the counter, the one he keeps for exactly this kind of transaction, and sets it on the wood between you.\n\n\"Whatever I want,\" he repeats, confirming the terms.\n\nYou nod. You are trying to project willingness. What you are actually feeling, without any courage to temper it, is a spreading, boneless dread.\n\nThe process takes about four minutes. "
        },
        {
          "text": "Pidge",
          "entity": "pidge"
        },
        {
          "text": " works quickly and without much ceremony. When it is done, he holds the small stoppered vial up to the lamp and tilts it. The liquid inside is gray-green, the color of shallow, brackish water.\n\n\"Hm,\" he says.\n\nHe sets the "
        },
        {
          "text": "venom",
          "entity": "eelVenom"
        },
        {
          "text": " on the counter and pushes it toward you. You reach for it and stop.\n\nThe color is wrong. Gray-green is anxiety. The kind you bottle and can barely sell.\n\nHe extracted your anxiety by mistake, and now the shelves feel very close, and the door feels very far, and the "
        },
        {
          "text": "moon-clock",
          "entity": "moonClock"
        },
        {
          "text": " on your "
        },
        {
          "text": "cottage",
          "entity": "cottage"
        },
        {
          "text": " wall is still ticking."
        }
      ],
      "choices": [],
      "ending": {
        "tag": "LOSS",
        "subtag": ""
      }
    },
    "n2_1_1": {
      "content": [
        {
          "text": "Pidge",
          "entity": "pidge"
        },
        {
          "text": " looks at you for a long moment. Then, slowly, he pulls a stool from behind the counter and sits down.\n\n\""
        },
        {
          "text": "Neave",
          "entity": "neave"
        },
        {
          "text": " bought two vials,\" he says. \"Asked questions about shelf life. About what happens to "
        },
        {
          "text": "venom",
          "entity": "eelVenom"
        },
        {
          "text": " past its peak.\" He pauses. \"Asked whether courage antidotes are even possible to brew solo.\"\n\nThe information lands like a stone in still water.\n\n"
        },
        {
          "text": "Neave Ashpool",
          "entity": "neave"
        },
        {
          "text": " already knows. Whether she's trying to help or trying to ensure you fail before the moon turns, you can't say. But the knowledge shifts something in you, some cold, practical corner of your mind that survived the self-extraction intact. You are not as alone in this as you thought, and that cuts both ways.\n\n"
        },
        {
          "text": "Pidge",
          "entity": "pidge"
        },
        {
          "text": " slides the "
        },
        {
          "text": "venom",
          "entity": "eelVenom"
        },
        {
          "text": " vial across the counter without naming a price.\n\n\"Bring me a bottle of whatever you feel when this is done,\" he says. \"I'll call it even.\"\n\nYou pocket the "
        },
        {
          "text": "venom",
          "entity": "eelVenom"
        },
        {
          "text": " and walk back into the rain."
        }
      ],
      "choices": [],
      "ending": {
        "tag": "WIN",
        "subtag": ""
      }
    },
    "n2_1_2": {
      "content": [
        {
          "text": "Pidge",
          "entity": "pidge"
        },
        {
          "text": "'s cold eyes follow your hand to your pocket. He does not raise his voice. He does not need to.\n\n\"I'll be sending a note to the "
        },
        {
          "text": "Circle",
          "entity": "circleHall"
        },
        {
          "text": ",\" he says. \"Tonight.\"\n\nYou walk out anyway, the "
        },
        {
          "text": "venom",
          "entity": "eelVenom"
        },
        {
          "text": " warm against your hip through the canvas, the bell ringing twice behind you. The rain has gotten worse. By the time you reach the track home, you already know the note will reach "
        },
        {
          "text": "Thessaly Grieve",
          "entity": "thessaly"
        },
        {
          "text": " by morning. By afternoon, the "
        },
        {
          "text": "Circle",
          "entity": "circleHall"
        },
        {
          "text": " will know about the self-extraction. They will come to your "
        },
        {
          "text": "cottage",
          "entity": "cottage"
        },
        {
          "text": " with their authority and their questions and their right to confiscate unlicensed bottled extractions, including one glowing gold bottle on your top shelf, labeled in your own handwriting.\n\nWithout the "
        },
        {
          "text": "courage bottle",
          "entity": "courageBottle"
        },
        {
          "text": ", there is no antidote. Without the antidote, there is no getting it back.\n\nThe "
        },
        {
          "text": "moon-clock",
          "entity": "moonClock"
        },
        {
          "text": " will tick twenty-seven days down to nothing.\n\n"
        },
        {
          "text": "Scoria",
          "entity": "scoria"
        },
        {
          "text": " will sit on your chest in the dark, purring, while the coward you've become waits for the knock at the door."
        }
      ],
      "choices": [],
      "ending": {
        "tag": "LOSS",
        "subtag": ""
      }
    },
    "n2_1": {
      "content": [
        {
          "text": "Your fingers find the ledger's spine and angle it toward you before your better judgment can intervene. The entries are dense and small. You scan backward through the week. There, four days ago, the same date as the "
        },
        {
          "text": "venom",
          "entity": "eelVenom"
        },
        {
          "text": " vial: "
        },
        {
          "text": "EEL VENOM",
          "entity": "eelVenom"
        },
        {
          "text": " x2, sold to N. "
        },
        {
          "text": "ASHPOOL",
          "entity": "neave"
        },
        {
          "text": ". "
        },
        {
          "text": "Neave Ashpool",
          "entity": "neave"
        },
        {
          "text": ", the "
        },
        {
          "text": "Circle",
          "entity": "circleHall"
        },
        {
          "text": "'s grief specialist, bought "
        },
        {
          "text": "eel venom",
          "entity": "eelVenom"
        },
        {
          "text": " four days ago. That is strange enough to lodge in your chest.\n\nThen the floorboard creaks and "
        },
        {
          "text": "Pidge",
          "entity": "pidge"
        },
        {
          "text": " is standing directly behind you.\n\nHe says nothing for a moment. The bell does not ring. Nobody is coming in to interrupt. The vial of "
        },
        {
          "text": "eel venom",
          "entity": "eelVenom"
        },
        {
          "text": " sits on the counter between you like a small accusation, and "
        },
        {
          "text": "Pidge",
          "entity": "pidge"
        },
        {
          "text": "'s expression has shifted from professional blankness into something colder and much more careful.\n\n\"I wasn't reading anything sensitive,\" you say, which is both true and completely beside the point.\n\n\"The ledger,\" "
        },
        {
          "text": "Pidge",
          "entity": "pidge"
        },
        {
          "text": " says, \"is chained to my counter.\" He lets that sit. \"Not for decoration.\"\n\nThe "
        },
        {
          "text": "venom",
          "entity": "eelVenom"
        },
        {
          "text": " is right there. You need it. He knows you need it, and now he also knows you are desperate enough to snoop through his private records in the thirty seconds his back was turned. Your three copper pennies feel very small in your "
        },
        {
          "text": "satchel",
          "entity": "satchel"
        },
        {
          "text": "."
        }
      ],
      "choices": [
        {
          "label": "Apologize openly and offer to let Pidge extract and bottle whatever emotion he wants from you right now, on the spot, as payment and penance combined.",
          "target": "n2_1_0"
        },
        {
          "label": "Keep your composure, slide the ledger back exactly as you found it, and calmly ask Pidge what he knows about Neave Ashpool buying eel venom this week.",
          "target": "n2_1_1"
        },
        {
          "label": "Pocket the venom vial from the counter while holding Pidge's gaze and tell him to add it to your tab, acting as if this is all perfectly normal business.",
          "target": "n2_1_2"
        }
      ]
    },
    "n2_2_0": {
      "content": [
        {
          "text": "Your hand moves before your brain catches up with it. The display case latch gives easily. The vial is in your palm, cool and smooth, and for one half-second it feels like the boldest thing you have done since this morning.\n\nThen your boot catches the edge of the floor mat and you go down hard, the vial spinning out of your fingers and cracking against the baseboard. Four-day-old "
        },
        {
          "text": "eel venom",
          "entity": "eelVenom"
        },
        {
          "text": " spreads in a thin clear puddle across "
        },
        {
          "text": "Pidge Harrow",
          "entity": "pidge"
        },
        {
          "text": "'s creaking floor.\n\n"
        },
        {
          "text": "Pidge",
          "entity": "pidge"
        },
        {
          "text": " stands over you with his ledger open and his spectacles slightly crooked. He does not raise his voice. He simply begins writing.\n\nBy evening, the "
        },
        {
          "text": "Bottlers' Circle",
          "entity": "circleHall"
        },
        {
          "text": " has received a formal complaint. By the next morning, your market license is suspended pending arbitration. The "
        },
        {
          "text": "moon-clock",
          "entity": "moonClock"
        },
        {
          "text": " on your wall keeps ticking.\n\nTwenty-six days now. No "
        },
        {
          "text": "venom",
          "entity": "eelVenom"
        },
        {
          "text": ". No license. And "
        },
        {
          "text": "Pidge Harrow",
          "entity": "pidge"
        },
        {
          "text": "'s bell ringing twice in your memory, opening and closing, like a small precise verdict."
        }
      ],
      "choices": [],
      "ending": {
        "tag": "LOSS",
        "subtag": ""
      }
    },
    "n2_2_1": {
      "content": [
        {
          "text": "Pidge",
          "entity": "pidge"
        },
        {
          "text": " sets his pen down and looks at you over his spectacles for a long moment. Then he says, \""
        },
        {
          "text": "Wick Calloway",
          "entity": "wick"
        },
        {
          "text": ". Brought in four vials last Thursday. Trades "
        },
        {
          "text": "venom",
          "entity": "eelVenom"
        },
        {
          "text": " for dried goods when the eels are running thick near his crossing.\"\n\nYou are out the door before the bell finishes its second ring.\n\n"
        },
        {
          "text": "Wick",
          "entity": "wick"
        },
        {
          "text": " is at the river landing, scraping algae from his punt with a flat stone. He listens to your offer without expression, three bottles of nostalgia from your stock, amber and warm, good quality. His eyes move to your trembling hands and back to your face, and he does not ask why a bottler witch needs "
        },
        {
          "text": "eel venom",
          "entity": "eelVenom"
        },
        {
          "text": " badly enough to come down to the river in the rain.\n\n\"I've got one vial left,\" he says. \"Extracted it myself this morning.\"\n\nHe trades you straight across for two bottles. You pocket the "
        },
        {
          "text": "venom",
          "entity": "eelVenom"
        },
        {
          "text": ", still warm from his jacket, and feel the "
        },
        {
          "text": "moon-clock",
          "entity": "moonClock"
        },
        {
          "text": " ticking somewhere far behind you. One ingredient down. Four to go. You walk back up the muddy track with your "
        },
        {
          "text": "satchel",
          "entity": "satchel"
        },
        {
          "text": " clutched close and something that is not quite courage but might be its distant cousin settling into your chest."
        }
      ],
      "choices": [],
      "ending": {
        "tag": "WIN",
        "subtag": ""
      }
    },
    "n2_2_2": {
      "content": [
        {
          "text": "Pidge",
          "entity": "pidge"
        },
        {
          "text": " sets down his pen and looks at you over his spectacles for a long moment.\n\n\"Which one,\" he says.\n\nYou think about what you have left. Mild contentment. Nostalgia. Heartsickness. Things you can live without for a while, things that will grow back on their own with enough time and ordinary days.\n\n\"Nostalgia,\" you say. \"I have five bottles at home, labeled and dated. I'll bring you the best one.\"\n\nSomething shifts in his expression, just slightly. He lost someone, you remember. A long time ago. You don't ask who.\n\nHe unlocks the display case.\n\nThe vial of "
        },
        {
          "text": "eel venom",
          "entity": "eelVenom"
        },
        {
          "text": " is cold and oily through the glass when he sets it in your palm. He writes in his ledger. You walk out into the rain with one ingredient sealed in your "
        },
        {
          "text": "satchel",
          "entity": "satchel"
        },
        {
          "text": " and twenty-seven days still on the clock.\n\nIt is not courage that carries you home. But it is enough."
        }
      ],
      "choices": [],
      "ending": {
        "tag": "WIN",
        "subtag": ""
      }
    },
    "n2_2_3": {
      "content": [
        {
          "text": "Three days later, you return to "
        },
        {
          "text": "Harrow's Apothecary",
          "entity": "apothecary"
        },
        {
          "text": " with four silver marks and mud in places you have stopped thinking about.\n\nThe "
        },
        {
          "text": "mushroom",
          "entity": "mushroom"
        },
        {
          "text": " caps came first, waded for at dawn when the eels were slow with cold. Then the "
        },
        {
          "text": "crystal",
          "entity": "phosphite"
        },
        {
          "text": " dust, scraped by raw fingernails while bats rustled overhead and your whole body shook so hard the powder nearly scattered. The "
        },
        {
          "text": "bridge-spider silk",
          "entity": "spiderSilk"
        },
        {
          "text": " you gathered in the dark with borrowed gloves, your eyes shut the entire time. The "
        },
        {
          "text": "viper thistle",
          "entity": "thistle"
        },
        {
          "text": " root you dug from the ridge in a sideways gale, crying once and briefly, then continuing.\n\n"
        },
        {
          "text": "Pidge",
          "entity": "pidge"
        },
        {
          "text": " hands over the "
        },
        {
          "text": "venom",
          "entity": "eelVenom"
        },
        {
          "text": " without ceremony. He writes something in his ledger and does not read it aloud.\n\nThat evening, the "
        },
        {
          "text": "cauldron",
          "entity": "cauldron"
        },
        {
          "text": " runs six hours. The antidote comes out gold, thinner than you expected, smelling of peat and something electric.\n\nYou drink it standing up.\n\nThe warmth returns like a door closing against the cold, and "
        },
        {
          "text": "Scoria",
          "entity": "scoria"
        },
        {
          "text": " jumps into your lap, purring her rattling purr, and you sit with both hands wrapped around her for a long time before you move."
        }
      ],
      "choices": [],
      "ending": {
        "tag": "WIN",
        "subtag": ""
      }
    },
    "n2_2": {
      "content": [
        {
          "text": "\"Two silver marks,\" you say, before "
        },
        {
          "text": "Pidge",
          "entity": "pidge"
        },
        {
          "text": " can reach for the vial. \"Fair price for four-day-old stock.\"\n\n"
        },
        {
          "text": "Pidge",
          "entity": "pidge"
        },
        {
          "text": " sets down his pen with the patience of a man who has heard every version of this before. \"Fresh-batch "
        },
        {
          "text": "venom",
          "entity": "eelVenom"
        },
        {
          "text": " from the "
        },
        {
          "text": "Deep Channel",
          "entity": "deepChannel"
        },
        {
          "text": " runs four silver, "
        },
        {
          "text": "Maren",
          "entity": "maren"
        },
        {
          "text": ". Has since last autumn when the "
        },
        {
          "text": "Circle",
          "entity": "circleHall"
        },
        {
          "text": " adjusted the harvest fee.\" He tilts his head. \"And you've got mud to your knees on a Tuesday, which tells me this isn't a casual purchase.\"\n\nYou open your "
        },
        {
          "text": "satchel",
          "entity": "satchel"
        },
        {
          "text": ". Three copper pennies catch the lamplight, looking very small and very inadequate.\n\nThe silence in the shop is thorough. The hanging herbs sway slightly in a draft from somewhere. "
        },
        {
          "text": "Pidge",
          "entity": "pidge"
        },
        {
          "text": "'s spectacles reflect two small versions of your own face back at you.\n\n\"I can put it aside for three days,\" he says, not unkindly. \"In case you find the difference.\" He is already writing something in the ledger. He does not ask what you need it for, but his pen moves with the careful deliberation of a man noting down details he finds interesting.\n\nThe vial sits in the glass case. Behind you, the door bell is waiting to ring once on the way out."
        }
      ],
      "choices": [
        {
          "label": "Snatch the vial from the display case and run before Pidge can get around the counter.",
          "target": "n2_2_0"
        },
        {
          "label": "Ask Pidge what he paid for the batch and who sold it to him, angling to go directly to the source.",
          "target": "n2_2_1"
        },
        {
          "label": "Offer to let Pidge extract a bottled emotion from you on the spot as payment, your choice of which one.",
          "target": "n2_2_2"
        },
        {
          "label": "Accept the three-day hold, then step outside and think through which of the other four ingredients you can reach before coming back with real coin.",
          "target": "n2_2_3"
        }
      ]
    },
    "n2_3_0": {
      "content": [
        {
          "text": "Pidge",
          "entity": "pidge"
        },
        {
          "text": " stares at you for a long moment, then uncaps his pen and begins to write.\n\nThe terms are not kind. Full disclosure to the "
        },
        {
          "text": "Bottlers' Circle",
          "entity": "circleHall"
        },
        {
          "text": " in exchange for the "
        },
        {
          "text": "venom",
          "entity": "eelVenom"
        },
        {
          "text": " on credit, with repayment due in one month. You sign at the bottom with a shaking hand.\n\nThree days later, "
        },
        {
          "text": "Thessaly Grieve",
          "entity": "thessaly"
        },
        {
          "text": " arrives at your door with her blackthorn stick and her sharp brown eye and no particular expression on her face. She reviews your bottle on the shelf and your signature on "
        },
        {
          "text": "Pidge",
          "entity": "pidge"
        },
        {
          "text": "'s paper and the "
        },
        {
          "text": "moon-clock",
          "entity": "moonClock"
        },
        {
          "text": " with its twenty-four remaining days. She tells you that self-extraction without "
        },
        {
          "text": "Circle",
          "entity": "circleHall"
        },
        {
          "text": " supervision is a censurable offense. She tells you the "
        },
        {
          "text": "venom",
          "entity": "eelVenom"
        },
        {
          "text": " "
        },
        {
          "text": "Pidge",
          "entity": "pidge"
        },
        {
          "text": " sold you was five days old by the time it reached your hands. Too old. Denature starts at four.\n\nYou could have gathered the other four ingredients and it would not have mattered.\n\nThe gold bottle glows on the shelf. The "
        },
        {
          "text": "moon-clock",
          "entity": "moonClock"
        },
        {
          "text": " ticks."
        }
      ],
