    "n2_3_1": {
      "content": [
        {
          "text": "Pidge",
          "entity": "pidge"
        },
        {
          "text": " looks at you for a long moment. Then he names his price: loneliness. A full bottle, sealed and labeled. He says it quietly, without embarrassment, and you don't ask why.\n\nYou set your "
        },
        {
          "text": "extraction kit",
          "entity": "extractionKit"
        },
        {
          "text": " on his counter, find the thread of it easily enough — you have plenty to work with — and watch the pale blue liquid fill "
        },
        {
          "text": "the bottle",
          "entity": "courageBottle"
        },
        {
          "text": " in slow, steady pulses. When you seal it with wax and hand it across, "
        },
        {
          "text": "Pidge",
          "entity": "pidge"
        },
        {
          "text": " writes nothing in his ledger. He simply takes the "
        },
        {
          "text": "venom",
          "entity": "eelVenom"
        },
        {
          "text": " from the case and sets it in your palm.\n\nThe walk home feels different. Not brave, exactly. The rain still makes you flinch and a rabbit in the sedge nearly stops your heart. But you have one ingredient in your "
        },
        {
          "text": "satchel",
          "entity": "satchel"
        },
        {
          "text": " and twenty-seven days on the clock, and "
        },
        {
          "text": "Maren Duskwell",
          "entity": "maren"
        },
        {
          "text": " has always been better at the work than she has been at believing she could do it.\n\nOne ingredient down. Four to go."
        }
      ],
      "choices": [],
      "ending": {
        "tag": "WIN",
        "subtag": ""
      }
    },
    "n2_3": {
      "content": [
        {
          "text": "Pidge",
          "entity": "pidge"
        },
        {
          "text": " sets his pen down. He does it slowly, which is worse than any sharp reaction would have been.\n\n\"Credit,\" he says. Not a question. He looks at the vial behind the glass, then back at you. The lamplight makes the shadows in his face deeper than usual. \"You self-extracted. "
        },
        {
          "text": "Maren",
          "entity": "maren"
        },
        {
          "text": ". You understand I keep records of everything I sell.\"\n\nHe taps the ledger with one green-stained finger. It isn't a threat, not exactly. "
        },
        {
          "text": "Pidge Harrow",
          "entity": "pidge"
        },
        {
          "text": " has never been a cruel man. But the "
        },
        {
          "text": "Bottlers' Circle",
          "entity": "circleHall"
        },
        {
          "text": " meets at each new moon, "
        },
        {
          "text": "Thessaly Grieve",
          "entity": "thessaly"
        },
        {
          "text": "'s sharp brown eye sees everything that passes through this valley, and "
        },
        {
          "text": "Pidge",
          "entity": "pidge"
        },
        {
          "text": "'s ledger is a chain that runs straight from his counter to guild law. He'd give you the "
        },
        {
          "text": "venom",
          "entity": "eelVenom"
        },
        {
          "text": " if the math worked in his favor. Right now it doesn't.\n\nThe rain drums against the wooden walls. The bell above the door is still. The vial sits in the case, four days old, possibly still potent. You have three copper pennies in your "
        },
        {
          "text": "satchel",
          "entity": "satchel"
        },
        {
          "text": " and a secret that "
        },
        {
          "text": "Pidge",
          "entity": "pidge"
        },
        {
          "text": " now shares.\n\nHe picks up his pen again and waits to see what you do next."
        }
      ],
      "choices": [
        {
          "label": "Agree to his terms, whatever they are, and ask him to put the arrangement in writing so both of you are protected if the Circle ever asks questions.",
          "target": "n2_3_0"
        },
        {
          "label": "Offer to extract and bottle whatever emotion he names from yourself, right now, on the spot, as full payment in kind.",
          "target": "n2_3_1"
        }
      ]
    },
    "n2": {
      "content": [
        {
          "text": "The walk into Fenwick village takes twenty minutes on a dry day. Today, with the rain turning the track to brown slurry and every shadow in the hedgerows making your heart lurch sideways, it takes closer to forty. You arrive at "
        },
        {
          "text": "Harrow's Apothecary",
          "entity": "apothecary"
        },
        {
          "text": " with mud up to your shins and your pulse still recovering from a startled crow.\n\nThe bell rings twice. "
        },
        {
          "text": "Pidge Harrow",
          "entity": "pidge"
        },
        {
          "text": " looks up from his ledger with the particular expression of a man who has been doing business with witches long enough to recognize trouble wearing a familiar face.\n\n\""
        },
        {
          "text": "Maren",
          "entity": "maren"
        },
        {
          "text": ",\" he says. His spectacles catch the lamplight. \"You look pale.\"\n\n\"Rain,\" you say.\n\nHe doesn't push it. The shelves crowd in on all sides, dried organs in jars, hanging bundles of gray-green herbs, the glass case with its expensive bottles. You scan quickly. He has dried "
        },
        {
          "text": "viper thistle",
          "entity": "thistle"
        },
        {
          "text": " root on the third shelf, but the "
        },
        {
          "text": "recipe",
          "entity": "recipe"
        },
        {
          "text": " specified fresh. In the display case, behind smudged glass, sits a small corked vial labeled in "
        },
        {
          "text": "Pidge",
          "entity": "pidge"
        },
        {
          "text": "'s tiny hand: "
        },
        {
          "text": "EEL VENOM",
          "entity": "eelVenom"
        },
        {
          "text": ", FENWICK, FRESH BATCH, with a date from four days ago.\n\nFour days is close enough to fresh. Possibly. Your hands want to shake and you are making them stop.\n\n"
        },
        {
          "text": "Pidge",
          "entity": "pidge"
        },
        {
          "text": " watches you look at the vial. He already knows you want it. He chains his ledger to the counter for a reason: everything here has a price, and he tracks every penny of it."
        }
      ],
      "choices": [
        {
          "label": "Offer him three bottles from your stock, letting him pick whichever emotions he wants, and frame it as a favor he can boast about to other buyers.",
          "target": "n2_0"
        },
        {
          "label": "While Pidge turns to check the vial's seal, flip quickly through the open ledger to see who else has been buying eel venom recently.",
          "target": "n2_1"
        },
        {
          "label": "Name a price in coin first, matching what you think it's worth, and push for a quick sale before he has time to wonder why you need it.",
          "target": "n2_2"
        },
        {
          "label": "Tell Pidge the truth, that you extracted your own courage and need the antidote ingredients, and ask if he will sell the venom on credit given the circumstances.",
          "target": "n2_3"
        }
      ]
    },
    "n3_0_0": {
      "content": [
        {
          "text": "Your fingers find the leather roll and pull it open. The silver needle catches the light from "
        },
        {
          "text": "Cull",
          "entity": "cull"
        },
        {
          "text": "'s hearth.\n\nHe watches without expression as you uncork the solvent, as you fit the small brass funnel, as you press the needle's tip to the thin skin of his inner wrist and try to hold it still.\n\nIt slips. Not badly. Just enough.\n\n"
        },
        {
          "text": "Cull",
          "entity": "cull"
        },
        {
          "text": " pulls his arm back, not fast, not angry, simply done. He takes the needle from your hand with two fingers and sets it on the workbench beside the funnel.\n\n\"Forget we spoke,\" he says, the same words he promised, and he means them. He is already moving toward the door.\n\nYou walk home in the rain with your empty "
        },
        {
          "text": "satchel",
          "entity": "satchel"
        },
        {
          "text": " and your trembling hands. The "
        },
        {
          "text": "moon-clock",
          "entity": "moonClock"
        },
        {
          "text": " ticks. Twenty-seven days remain. Your courage glows gold on its shelf, warm and slow, and "
        },
        {
          "text": "Scoria",
          "entity": "scoria"
        },
        {
          "text": " watches you from the workbench with yellow eyes, waiting for nothing in particular."
        }
      ],
      "choices": [],
      "ending": {
        "tag": "LOSS",
        "subtag": ""
      }
    },
    "n3_0_1": {
      "content": [
        {
          "text": "Cull",
          "entity": "cull"
        },
        {
          "text": " looks at your hands. He looks at your face. Then he lets out a long breath through his nose and pulls a sheet of paper from his workbench drawer.\n\nHe writes slowly, in block letters, with a stub of graphite. His confidence for your courage, extraction to follow, his labor for every ingredient on the list. He signs it, slides it across, and waits while you add your unsteady signature beneath his steady one.\n\n\""
        },
        {
          "text": "Dorrit Fenn",
          "entity": "dorrit"
        },
        {
          "text": " saw you come in,\" he says, folding his copy. \"That's witness enough in this valley.\"\n\nHe opens a cabinet and hands you a small vial, pale gold, not your bottle but something from his own stock. \"Enough to hold the needle when the time comes.\"\n\nYou pocket the agreement and the vial and walk back out into the rain. The "
        },
        {
          "text": "moon-clock",
          "entity": "moonClock"
        },
        {
          "text": " is ticking. But for the first time since this morning, so are you."
        }
      ],
      "choices": [],
      "ending": {
        "tag": "WIN",
        "subtag": ""
      }
    },
    "n3_0": {
      "content": [
        {
          "text": "Cull",
          "entity": "cull"
        },
        {
          "text": " goes quiet. You watch the idea move across his face like weather, and you can see the moment he prices it out. "
        },
        {
          "text": "Cull Redmarsh",
          "entity": "cull"
        },
        {
          "text": "'s Confidence, Named Extraction. Behind "
        },
        {
          "text": "Pidge Harrow",
          "entity": "pidge"
        },
        {
          "text": "'s glass case with a figure beside it that would make you both comfortable for a year.\n\n\"That's not a poor pitch,\" he says slowly.\n\nThen he stands from the stool and pulls his apron straight.\n\n\"But you'd need steady hands for it. And a clean needle. And some nerve.\" He lets the last word settle deliberately between you. \"How are your hands right now, "
        },
        {
          "text": "Maren",
          "entity": "maren"
        },
        {
          "text": "?\"\n\nThey are trembling. He can see them from where he stands.\n\nHe crosses his thick arms. \"I'll sit for the extraction. Here, now, with whatever's in that "
        },
        {
          "text": "satchel",
          "entity": "satchel"
        },
        {
          "text": ". You pull a clean bottle, we have a deal. I keep your courage as a named curio, you walk out with a measure of working courage and my labor for every ingredient on that list.\" He extends one broad hand across the scarred workbench. \"If you can't hold the needle, we forget we spoke.\"\n\nHis sharp eye watches you. His hand stays out.\n\nYour "
        },
        {
          "text": "extraction kit",
          "entity": "extractionKit"
        },
        {
          "text": " is in your "
        },
        {
          "text": "satchel",
          "entity": "satchel"
        },
        {
          "text": ". The needle is there. Your fingers won't stop moving."
        }
      ],
      "choices": [
        {
          "label": "Grip his hand and shake it before he can change his mind, committing yourself to the extraction right now, and reach into your satchel for the kit before the trembling gets worse.",
          "target": "n3_0_0"
        },
        {
          "label": "Tell him plainly that your hands won't hold the needle safely today, and propose putting the terms in writing now, sealed and witnessed, with the extraction to follow once you have even a small measure of borrowed steadiness.",
          "target": "n3_0_1"
        }
      ]
    },
    "n3_1_0": {
      "content": [
        {
          "text": "Cull",
          "entity": "cull"
        },
        {
          "text": "'s expression shifts. Something closes behind his eyes.\n\n\"Writing,\" he repeats.\n\nHe looks at the folding knife in your hand. He looks at the cloth-wrapped bundle in the locked drawer. Then he lets out a slow breath through his nose, reaches back into the drawer, and sets your "
        },
        {
          "text": "courage bottle",
          "entity": "courageBottle"
        },
        {
          "text": " on the workbench between you.\n\n\"Take it back,\" he says. \"And get out of my house.\"\n\nYou don't understand at first.\n\n\"I was going to honor the deal,\" he says, flat and final. \"I've done honest business in this valley for thirty years. You sit in my house and ask me to sign terms like I'm a man who cheats cowardly women.\" He shakes his head. \"I'm not interested anymore. Find someone else.\"\n\nHe holds the door open.\n\nYou walk back into the rain with your "
        },
        {
          "text": "courage bottle",
          "entity": "courageBottle"
        },
        {
          "text": " in your "
        },
        {
          "text": "satchel",
          "entity": "satchel"
        },
        {
          "text": " and no borrowed steadiness, no collected ingredients, no allies. The "
        },
        {
          "text": "moon-clock",
          "entity": "moonClock"
        },
        {
          "text": " at home is still ticking. Twenty-seven days, and you are exactly where you started, only colder."
        }
      ],
      "choices": [],
      "ending": {
        "tag": "LOSS",
        "subtag": ""
      }
    },
    "n3_1_1": {
      "content": [
        {
          "text": "You pocket the vial and step back into the rain before "
        },
        {
          "text": "Cull",
          "entity": "cull"
        },
        {
          "text": " can say another word.\n\nThe problem becomes clear about halfway home. Without the borrowed courage in your blood, every shadow between the cottages is a threat, every sound in the hedgerow stops your feet. You stand in the mud for a long time telling yourself to move toward the "
        },
        {
          "text": "Underbog",
          "entity": "underbog"
        },
        {
          "text": ", toward the mushrooms, toward anything useful.\n\nYou don't move.\n\nThree days pass. Then five. You eat cold porridge and don't open the door. "
        },
        {
          "text": "Scoria",
          "entity": "scoria"
        },
        {
          "text": " watches you from the workbench with her yellow eyes. The "
        },
        {
          "text": "moon-clock",
          "entity": "moonClock"
        },
        {
          "text": " ticks.\n\nWhen "
        },
        {
          "text": "Dorrit Fenn",
          "entity": "dorrit"
        },
        {
          "text": " finally knocks with "
        },
        {
          "text": "Cull",
          "entity": "cull"
        },
        {
          "text": "'s message that the ingredients are ready, you open the door just wide enough to see her face and tell her you've changed your mind.\n\nYou haven't changed your mind. You're simply out of time, and the courage is in someone else's locked drawer, and it's going to stay there.\n\nThe "
        },
        {
          "text": "moon-clock",
          "entity": "moonClock"
        },
        {
          "text": " ticks."
        }
      ],
      "choices": [],
      "ending": {
        "tag": "LOSS",
        "subtag": ""
      }
    },
    "n3_1_2": {
      "content": [
        {
          "text": "The borrowed courage goes down warm and thin, like broth where there should be bread. It steadies your hands. It quiets the part of your mind that has been screaming since the mouse.\n\n"
        },
        {
          "text": "Cull",
          "entity": "cull"
        },
        {
          "text": " watches you drink with an expression you cannot quite read.\n\n\""
        },
        {
          "text": "Underbog",
          "entity": "underbog"
        },
        {
          "text": ",\" he says. \""
        },
        {
          "text": "Heartblood mushroom",
          "entity": "mushroom"
        },
        {
          "text": " first. I know where the dead oaks are.\"\n\nYou follow him out into the rain feeling almost like yourself. Almost.\n\nWhat you do not account for is the difference between borrowed and owned. "
        },
        {
          "text": "Cull",
          "entity": "cull"
        },
        {
          "text": "'s courage fits him the way a stranger's coat fits, and when the first eel surfaces in the black water beside the fallen oak, the borrowed steadiness simply evaporates. You stumble back into the sedge. "
        },
        {
          "text": "Cull",
          "entity": "cull"
        },
        {
          "text": " catches you by the arm, but your ankle turns on the shifting peat and the cold water takes you fast.\n\n"
        },
        {
          "text": "Cull",
          "entity": "cull"
        },
        {
          "text": " pulls you out. Your "
        },
        {
          "text": "satchel",
          "entity": "satchel"
        },
        {
          "text": " does not survive.\n\nNeither does the vial.\n\nYou sit in the mud, soaked and shaking, while "
        },
        {
          "text": "Cull",
          "entity": "cull"
        },
        {
          "text": " collects the "
        },
        {
          "text": "mushroom",
          "entity": "mushroom"
        },
        {
          "text": " alone. You have surrendered your courage permanently, taken on a debt you cannot repay, and learned that borrowed bravery has no roots. The "
        },
        {
          "text": "moon-clock",
          "entity": "moonClock"
        },
        {
          "text": " at home is ticking. Twenty-six days remain, and "
        },
        {
          "text": "the bottle",
          "entity": "courageBottle"
        },
        {
          "text": " on "
        },
        {
          "text": "Cull",
          "entity": "cull"
        },
        {
          "text": "'s locked shelf glows gold for someone else."
        }
      ],
      "choices": [],
      "ending": {
        "tag": "LOSS",
        "subtag": ""
      }
    },
    "n3_1": {
      "content": [
        {
          "text": "You pull the "
        },
        {
          "text": "courage bottle",
          "entity": "courageBottle"
        },
        {
          "text": " from your "
        },
        {
          "text": "satchel",
          "entity": "satchel"
        },
        {
          "text": " and set it on his workbench before your hands can change their mind.\n\n"
        },
        {
          "text": "Cull",
          "entity": "cull"
        },
        {
          "text": " goes very still.\n\nHe looks at "
        },
        {
          "text": "the bottle",
          "entity": "courageBottle"
        },
        {
          "text": ", then at you, then at "
        },
        {
          "text": "the bottle",
          "entity": "courageBottle"
        },
        {
          "text": " again. The gold light catches in his beard. For a long moment the only sounds are the rain on the roof and the low hiss of his hearth.\n\n\"That was stupid,\" he says, not unkindly.\n\nThen he reaches past "
        },
        {
          "text": "the bottle",
          "entity": "courageBottle"
        },
        {
          "text": ", opens a locked drawer with a key from his belt, and sets a smaller vial in front of you. The liquid inside is a diluted gold, thinner than what you surrendered, but unmistakably the same family. Borrowed courage. Enough to steady your hands. He slides it across the wood with one thick finger.\n\n\"You'll have your antidote ingredients by tomorrow evening,\" he says. \"I'll send word through the Fenn girl when they're ready.\" He wraps your bottle in a cloth and tucks it into the drawer. He locks it. \"You trusted me with the thing. Least I can do is earn it.\"\n\nHe says it gruffly, like a man annoyed at himself for being honorable.\n\nThe vial sits in front of you, glowing faintly. You have not picked it up yet."
        }
      ],
      "choices": [
        {
          "label": "Press him to put the terms in writing before you touch the vial, pulling out your folding knife to offer as a signing instrument if needed.",
          "target": "n3_1_0"
        },
        {
          "label": "Pocket the vial without drinking it and slip out into the rain, intending to gather at least one ingredient yourself before Cull can use this debt as leverage over you.",
          "target": "n3_1_1"
        },
        {
          "label": "Pick up the vial, drink it where he can see you, and ask him directly which ingredient he plans to collect first so you can go along and learn how he handles each danger.",
          "target": "n3_1_2"
        }
      ]
    },
    "n3_2_0": {
      "content": [
        {
          "text": "Cull",
          "entity": "cull"
        },
        {
          "text": " blinks, just once, and then he almost smiles. He fetches paper.\n\nYou write the terms together at his workbench, word by careful word. The borrowed courage, measured and timed. His obligation to gather two of the five ingredients while you manage the rest. The "
        },
        {
          "text": "courage bottle",
          "entity": "courageBottle"
        },
        {
          "text": " held in trust at the "
        },
        {
          "text": "Circle",
          "entity": "circleHall"
        },
        {
          "text": " Hall, not in his cabinet, until the antidote is brewed and witnessed. His name. Your name. Signatures in ink.\n\nHe gathers the "
        },
        {
          "text": "eel venom",
          "entity": "eelVenom"
        },
        {
          "text": " and the "
        },
        {
          "text": "bridge-spider silk",
          "entity": "spiderSilk"
        },
        {
          "text": " without complaint, and you manage the "
        },
        {
          "text": "mushroom",
          "entity": "mushroom"
        },
        {
          "text": ", the "
        },
        {
          "text": "crystal",
          "entity": "phosphite"
        },
        {
          "text": " dust, and the "
        },
        {
          "text": "viper thistle",
          "entity": "thistle"
        },
        {
          "text": " root with shaking hands and the borrowed warmth of half a vial keeping your legs under you.\n\nThe antidote takes six hours. When you drink it, the gold comes back into your chest like sunlight through a closing window, and it is entirely yours.\n\n"
        },
        {
          "text": "Cull",
          "entity": "cull"
        },
        {
          "text": " retrieves "
        },
        {
          "text": "the bottle",
          "entity": "courageBottle"
        },
        {
          "text": " from the "
        },
        {
          "text": "Circle",
          "entity": "circleHall"
        },
        {
          "text": " Hall. A fair trade, on paper.\n\nYou shake his hand and walk home in the rain."
        }
      ],
      "choices": [],
      "ending": {
        "tag": "WIN",
        "subtag": ""
      }
    },
    "n3_2_1": {
      "content": [
        {
          "text": "The borrowed courage hits your blood like hot tea, bright and foreign and not quite yours. You feel steadier. You feel almost like yourself.\n\nYou gather four of the five ingredients over three grueling days. The "
        },
        {
          "text": "eel venom",
          "entity": "eelVenom"
        },
        {
          "text": " nearly costs you a finger. The "
        },
        {
          "text": "spider silk",
          "entity": "spiderSilk"
        },
        {
          "text": " leaves a welt on your wrist that weeps for a night. But the borrowed courage holds, and you return to "
        },
        {
          "text": "Cull",
          "entity": "cull"
        },
        {
          "text": "'s door with your "
        },
        {
          "text": "satchel",
          "entity": "satchel"
        },
        {
          "text": " full, needing only to collect the "
        },
        {
          "text": "heartblood mushroom",
          "entity": "mushroom"
        },
        {
          "text": " from the "
        },
        {
          "text": "Underbog",
          "entity": "underbog"
        },
        {
          "text": " before the brew.\n\nBut the vial is empty. You drank it all at once.\n\nThe "
        },
        {
          "text": "Underbog",
          "entity": "underbog"
        },
        {
          "text": " greets you with cold water and the slow white shapes of eels moving beneath the surface. The borrowed courage is gone, burned through in three days instead of five. Your legs stop at the water's edge and do not move again.\n\nThe "
        },
        {
          "text": "moon-clock",
          "entity": "moonClock"
        },
        {
          "text": " ticks at home on the wall, indifferent. Twenty-four days become twenty. Then ten. Then none.\n\n"
        },
        {
          "text": "Cull",
          "entity": "cull"
        },
        {
          "text": " collects "
        },
        {
          "text": "the bottle",
          "entity": "courageBottle"
        },
        {
          "text": " at month's end, polite as always. He marks it in his ledger: "
        },
        {
          "text": "Maren Duskwell",
          "entity": "maren"
        },
        {
          "text": ", courage, named extraction. A curiosity. It sells well at the next market to someone who needs it more than you do now."
        }
      ],
      "choices": [],
      "ending": {
        "tag": "LOSS",
        "subtag": ""
      }
    },
    "n3_2_2": {
      "content": [
        {
          "text": "Cull",
          "entity": "cull"
        },
        {
          "text": "'s patience vanishes the moment your fingers close around the "
        },
        {
          "text": "Circle",
          "entity": "circleHall"
        },
        {
          "text": "-sealed bottle.\n\nHe moves faster than a man his size should. One thick hand closes around your wrist before you can set it on the table, and his voice drops to something quiet and final. \"Put it back.\"\n\nYou don't put it back. You try to pull away instead, and "
        },
        {
          "text": "the bottle",
          "entity": "courageBottle"
        },
        {
          "text": " slips, and hits the packed earth floor, and does not break. It simply rolls under the workbench while "
        },
        {
          "text": "Cull",
          "entity": "cull"
        },
        {
          "text": " looks at you with an expression that has moved well past measuring into something colder.\n\nHe retrieves the vial of borrowed courage from the table and pockets it.\n\n\"Get out,\" he says. \"And when "
        },
        {
          "text": "Thessaly Grieve",
          "entity": "thessaly"
        },
        {
          "text": " asks me at next new moon why "
        },
        {
          "text": "Maren Duskwell",
          "entity": "maren"
        },
        {
          "text": " tried to steal "
        },
        {
          "text": "Circle",
          "entity": "circleHall"
        },
        {
          "text": " arbitration evidence from my shelf, I'll tell her exactly what I saw.\"\n\nYou walk home through the rain. The "
        },
        {
          "text": "moon-clock",
          "entity": "moonClock"
        },
        {
          "text": " is still ticking. Twenty-seven days feels much shorter now."
        }
      ],
      "choices": [],
      "ending": {
        "tag": "LOSS",
        "subtag": ""
      }
    },
    "n3_2_3": {
      "content": [
        {
          "text": "Cull",
          "entity": "cull"
        },
        {
          "text": "'s hand is warm and dry in yours. You shake it, then pick up the vial and say it lightly, almost as an afterthought.\n\n\"Noticed you've got a "
        },
        {
          "text": "Circle",
          "entity": "circleHall"
        },
        {
          "text": "-sealed bottle on your second shelf.\"\n\nSomething changes behind his eyes. Not fear, not guilt, but a closing, a door swinging shut behind a careful face. \"Lot of things on that shelf,\" he says.\n\n\"Yes,\" you agree, and leave it there.\n\nYou walk home through the rain with the vial in your "
        },
        {
          "text": "satchel",
          "entity": "satchel"
        },
        {
          "text": " and the agreement settled. For three days you gather ingredients, borrowing "
        },
        {
          "text": "Cull",
          "entity": "cull"
        },
        {
          "text": "'s courage in measured sips, and it feels wrong in your chest the whole time, like wearing someone else's coat. On the fourth morning "
        },
        {
          "text": "Cull",
          "entity": "cull"
        },
        {
          "text": " arrives at your door before you've collected the final "
        },
        {
          "text": "mushroom",
          "entity": "mushroom"
        },
        {
          "text": ". He wants his bottle early, he says. Just to hold it. Just for safekeeping.\n\nYou hand it over. He never comes back.\n\nThe "
        },
        {
          "text": "moon-clock",
          "entity": "moonClock"
        },
        {
          "text": " ticks. Twenty-three days, then fifteen, then four.\n\nYou brew what you have. It isn't enough."
        }
      ],
      "choices": [],
      "ending": {
        "tag": "LOSS",
        "subtag": ""
      }
    },
    "n3_2": {
      "content": [
        {
          "text": "You nod and "
        },
        {
          "text": "Cull",
          "entity": "cull"
        },
        {
          "text": " stands, moving to a locked cabinet at the back of the room to measure out a working dose of courage. His broad back is to you for perhaps twenty seconds.\n\nYour eyes move fast. Three shelves. Dozens of bottles. Most are labeled in his cramped hand with initials and dates, the usual stock. But on the second shelf, wedged between a bottle of determination and something murky brown, sits a small dark vial sealed with the "
        },
        {
          "text": "Bottlers' Circle",
          "entity": "circleHall"
        },
        {
          "text": " stamp in red wax. "
        },
        {
          "text": "Circle",
          "entity": "circleHall"
        },
        {
          "text": "-sealed vials mean arbitration evidence, testimony extracts, the kind of thing that becomes very interesting if a dispute ever comes before "
        },
        {
          "text": "Thessaly Grieve",
          "entity": "thessaly"
        },
        {
          "text": " and the others.\n\nYou don't know what it contains. You don't know whose initials are on it. You barely have time to read them before "
        },
        {
          "text": "Cull",
          "entity": "cull"
        },
        {
          "text": " turns around with a corked vial of warm amber liquid in one hand and his measuring eye on you.\n\nHe sets the vial on the table between you. \"Drink half now, half when you've gathered the last ingredient,\" he says. \"It won't feel like yours. It never does, borrowed courage.\" He folds his arms. \"Do we have a deal?\"\n\nHe is watching your face with that same patient, measuring calm."
        }
      ],
      "choices": [
        {
          "label": "Ask him to fetch a blank contract page and make the agreement formal, naming every term clearly, before you touch the vial.",
          "target": "n3_2_0"
        },
        {
          "label": "Pick up the vial and drink the full measure at once, committing completely and trusting that the warmth of it will carry you through whatever comes next.",
          "target": "n3_2_1"
        },
        {
          "label": "Reach past the vial and lift the Circle-sealed bottle from his shelf, then set it on the table beside the deal as collateral he holds for you and you hold for him.",
          "target": "n3_2_2"
        },
        {
          "label": "Say yes, shake his hand, and mention as you pick up the vial that you noticed the Circle-sealed bottle, just so he knows you noticed, and let that sit between you without another word.",
          "target": "n3_2_3"
        }
      ]
    },
    "n3_3_0": {
      "content": [
        {
          "text": "Old Sable",
          "entity": "sable"
        },
        {
          "text": " turns the three spools in her palm, then looks at your folding knife with the bone handle. She opens it, closes it, opens it again.\n\n\"Fair,\" she says, and hands over the "
        },
        {
          "text": "silk",
          "entity": "spiderSilk"
        },
        {
          "text": ".\n\nThat is the first thing that has gone right in two days. You stand under the bridge a moment longer than necessary, listening to the river, feeling the spiders shift overhead, and you do not run.\n\nIt takes eleven more days. The mushrooms come from the "
        },
        {
          "text": "Underbog",
          "entity": "underbog"
        },
        {
          "text": " at dawn, when the eels are slow. The "
        },
        {
          "text": "crystal",
          "entity": "phosphite"
        },
        {
          "text": " dust from the "
        },
        {
          "text": "caves",
          "entity": "caves"
        },
        {
          "text": " costs you a nosebleed and a torn sleeve from a bat that misjudged the dark. The "
        },
        {
          "text": "viper thistle",
          "entity": "thistle"
        },
        {
          "text": " root is fresh, cold, and hard-won from a hillside that wanted to throw you off it.\n\nYou brew for six hours without stopping.\n\nWhen the antidote clears gold and you drink it down, the courage comes home like warmth returning to a numbed hand. Slow, then all at once.\n\n"
        },
        {
          "text": "Scoria",
          "entity": "scoria"
        },
        {
          "text": " headbutts your ankle. You scratch her ear and finally, finally, exhale."
        }
      ],
      "choices": [],
      "ending": {
        "tag": "WIN",
        "subtag": ""
      }
    },
    "n3_3_1": {
      "content": [
        {
          "text": "Old Sable",
          "entity": "sable"
        },
        {
          "text": " is quiet for a long moment. Then she laughs, a dry sound like paper tearing, and shakes her head.\n\n\"Partnership,\" she repeats. \"With a woman who can't climb down a bridge ladder without stopping on every rung to check if the rungs are going to bite her.\"\n\nShe has already seen more than you wanted her to. Her pale eyes move to your hands, your careful footsteps, the way you flinch at the spiders shifting overhead.\n\n\"Self-extraction,\" she says, the same way "
        },
        {
          "text": "Cull",
          "entity": "cull"
        },
        {
          "text": " said it. Not a question.\n\nShe picks up her spools and tucks them into her coat one by one. \"I don't deal in futures. I deal in coin.\"\n\nShe pulls the oilcloth shut.\n\nYou stand under "
        },
        {
          "text": "Grathbone Bridge",
          "entity": "grathbone"
        },
        {
          "text": " in the rain, one ingredient away and no closer, while the spiders settle back into their webs above you and the "
        },
        {
          "text": "moon-clock",
          "entity": "moonClock"
        },
        {
          "text": " at home ticks on without mercy."
        }
      ],
      "choices": [],
      "ending": {
        "tag": "LOSS",
        "subtag": ""
      }
    },
    "n3_3_2": {
      "content": [
        {
          "text": "Old Sable",
          "entity": "sable"
        },
        {
          "text": " counts the three pennies without comment and hands you two spools. Not three, but two, and the "
        },
        {
          "text": "silk",
          "entity": "spiderSilk"
        },
        {
          "text": " catches the dim light like water.\n\n\"Fair price for fair coin,\" she says, and goes back to her work.\n\nYou stand under the bridge for a moment, listening to the river. You have one ingredient. The folding knife is still in your "
        },
        {
          "text": "satchel",
          "entity": "satchel"
        },
        {
          "text": ". The other four ingredients are still out there, still dangerous, still requiring everything you no longer have easy access to.\n\nBut you came down from the bridge. You handed over the pennies. You didn't run.\n\nOver the next three weeks, moving slowly and carefully, you gather each ingredient in turn. Fresh "
        },
        {
          "text": "eel venom",
          "entity": "eelVenom"
        },
        {
          "text": " from a shallows pool at low water. "
        },
        {
          "text": "Crystal",
          "entity": "phosphite"
        },
        {
          "text": " dust scraped by feel in the dark. "
        },
        {
          "text": "Mushroom",
          "entity": "mushroom"
        },
        {
          "text": " caps cut at the edge of the "
        },
        {
          "text": "Underbog",
          "entity": "underbog"
        },
        {
          "text": ", boots sinking, hands shaking the entire time.\n\nThe antidote brews six hours. When you drink it, the gold pours back into you like warmth returning to a cold room, and "
        },
        {
          "text": "Scoria",
          "entity": "scoria"
        },
        {
          "text": ", entirely indifferent, climbs into your lap and purrs."
        }
      ],
      "choices": [],
      "ending": {
        "tag": "WIN",
        "subtag": ""
      }
    },
    "n3_3_3": {
      "content": [
        {
          "text": "Old Sable",
          "entity": "sable"
        },
        {
          "text": " stops turning the spool. The silence under the bridge is long enough that you hear each individual drop hitting the river below. Her pale eyes move from your face to the spools arranged beside her, then back to your face. She has lived under this bridge for a very long time. She knows the "
        },
        {
          "text": "Bottlers' Circle",
          "entity": "circleHall"
        },
        {
          "text": " meets only at new moon. She knows the current market rates the way she knows the spider webs overhead, by touch, by habit, by years of careful attention. \"Double rate,\" she says, flatly. You try to hold her gaze. You fail. She gathers every spool into her oilcloth wrap with her shortened fingers, slow and deliberate, and tucks the bundle behind her without another word. She picks up a different piece of work entirely. You are dismissed. You walk home in the rain with empty hands. On the wall, the "
        },
        {
          "text": "moon-clock",
          "entity": "moonClock"
        },
        {
          "text": " ticks. Twenty-six days now. The "
        },
        {
          "text": "courage bottle",
          "entity": "courageBottle"
        },
        {
          "text": " glows on the shelf, indifferent and gold, and "
        },
        {
          "text": "Scoria",
          "entity": "scoria"
        },
        {
          "text": " does not even look up."
        }
      ],
      "choices": [],
      "ending": {
        "tag": "LOSS",
        "subtag": ""
      }
    },
    "n3_3": {
      "content": [
        {
          "text": "The rain finds every gap in your collar on the walk back. You are halfway across "
        },
        {
          "text": "Grathbone Bridge",
          "entity": "grathbone"
        },
        {
          "text": ", head down, watching your boots on the wet stone, when a voice comes from below.\n\n\"You look like something the river spat out.\"\n\n"
        },
        {
          "text": "Old Sable",
          "entity": "sable"
        },
        {
          "text": " is wedged under the bridge's eastern arch in her oilcloth shelter, fingers working a small spool of nearly invisible thread. Her pale eyes track you through the gap in the railing. On the stone beside her, a dozen tidy spools are arranged in a row, each labeled with a scrap of rag tied at the end. Red-marked "
        },
        {
          "text": "spider silk",
          "entity": "spiderSilk"
        },
        {
          "text": ", harvested from the very spiders that nest in the dark above her head.\n\nOne ingredient. Right here. You have three copper pennies in your "
        },
        {
          "text": "satchel",
          "entity": "satchel"
        },
        {
          "text": " and a coward's sweat on your palms.\n\n"
        },
        {
          "text": "Old Sable",
          "entity": "sable"
        },
        {
          "text": " turns the spool in her twisted fingers and watches you the way people watch weather, patient and without expectation. The spiders shift in their webs overhead. The river churns forty feet below, cold and loud.\n\n\"Buying or just staring?\" she says."
        }
      ],
      "choices": [
        {
          "label": "Study the row of spools from up on the bridge until you spot which ones carry the red-marked silk specifically, then climb down and offer Old Sable your folding knife for exactly those three spools.",
          "target": "n3_3_0"
        },
        {
          "label": "Climb down into the shelter and propose a partnership, offering Old Sable a share of the finished antidote's value if she helps you collect silk from the spiders directly, right now, together.",
          "target": "n3_3_1"
        },
        {
          "label": "Come down from the bridge, lay your three copper pennies on the stone, and buy however much silk that earns you without bargaining or pushing for more than is fair.",
          "target": "n3_3_2"
        },
        {
          "label": "Tell Old Sable that the Bottlers' Circle is paying double the market rate for red-marked silk this moon cycle and that she should bring her whole stock to the Circle Hall tomorrow, leaving you free to take what you need now.",
          "target": "n3_3_3"
        }
      ]
    },
    "n3": {
      "content": [
        {
          "text": "Cull Redmarsh",
          "entity": "cull"
        },
        {
          "text": "'s bottling house is warm and smells of iron and rendered fat. He answers the door in his leather apron, one enormous hand still wrapped around a glass stirring rod, and he takes one look at your face before he steps aside to let you in.\n\nYou get through about thirty seconds of explanation before he raises a hand to stop you.\n\n\"Self-extraction,\" he says. Not a question. He sets the stirring rod down on his workbench and looks at you the way a butcher looks at a joint of meat, measuring and calm. \"I can tell from the way you're standing in my doorway like it might bite you.\"\n\nYou make your offer anyway. The full shelf. Forty bottles, contentment and nostalgia and heartsickness and all the rest, in exchange for his help gathering the five ingredients.\n\n"
        },
        {
          "text": "Cull",
          "entity": "cull"
        },
        {
          "text": " is quiet for a moment. Then he pulls a low stool out from under his workbench and sits on it, settling his weight, in no hurry whatsoever.\n\n\"I don't need your shelf stock,\" he says. \"I've got more mild contentment than I can move at three markets running.\" He folds his thick arms across his chest. \"What I'd take is "
        },
        {
          "text": "the bottle",
          "entity": "courageBottle"
        },
        {
          "text": " itself. "
        },
        {
          "text": "Maren Duskwell",
          "entity": "maren"
        },
        {
          "text": "'s own courage, labeled and sealed. That's a curiosity. Collectors pay well for named extractions.\" He pauses. \"I'd lend you a measure of working courage to steady your hands for the gathering. Enough to do the job. You brew the antidote, you're made whole. I keep "
        },
        {
          "text": "the bottle",
          "entity": "courageBottle"
        },
        {
          "text": ". Everyone gets what they need.\"\n\nHe watches you with the patience of a man who already knows he has the better position."
        }
      ],
      "choices": [
        {
          "label": "Counter his offer directly: propose to bottle something rare from him instead, a named extraction of Cull Redmarsh's own confidence, which would fetch far more than your bottle and costs him nothing but an afternoon.",
          "target": "n3_0"
        },
        {
          "label": "Accept his terms immediately and hand over the courage bottle now, as a show of trust, before he has formally agreed to anything.",
          "target": "n3_1"
        },
        {
          "label": "Agree with a nod while letting your eyes drift across his shelves, looking for something you could slip into your satchel that would give you leverage if he decides not to honor the deal.",
          "target": "n3_2"
        },
        {
          "label": "Tell him you'll think on it, step back out into the rain, and walk away from the negotiation entirely rather than give him any piece of what is yours.",
          "target": "n3_3"
        }
      ]
    },
    "root": {
      "content": [
        {
          "text": "The bottle",
          "entity": "courageBottle"
        },
        {
          "text": " glows gold on the shelf, warm and slow and entirely out of reach.\n\nYou know it is out of reach because you tried to get it down three minutes ago and your legs simply refused. You are "
        },
        {
          "text": "Maren Duskwell",
          "entity": "maren"
        },
        {
          "text": ", a bottler witch of thirty-four years, and you are currently crouched behind your own "
        },
        {
          "text": "cauldron",
          "entity": "cauldron"
        },
        {
          "text": " with your knees drawn to your chest, listening to the rain hammer the moss roof and trying to remember how you breathe.\n\nIt had seemed like a reasonable experiment. Self-extraction, yes, technically reckless, but the morning had been still and the process had felt controlled right up until the moment the courage left your body like heat bleeding out of an open door. You felt it go. You watched "
        },
        {
          "text": "the bottle",
          "entity": "courageBottle"
        },
        {
          "text": " fill with gold.\n\nThen a mouse ran across the floor and you screamed.\n\n"
        },
        {
          "text": "Scoria",
          "entity": "scoria"
        },
        {
          "text": ", your cat, stares at you from atop the workbench with yellow eyes that contain no sympathy whatsoever.\n\nThe antidote "
        },
        {
          "text": "recipe",
          "entity": "recipe"
        },
        {
          "text": " is in your hands, torn from "
        },
        {
          "text": "Grieve",
          "entity": "thessaly"
        },
        {
          "text": "'s Common Bottling Errors, the ink faded brown and the paper trembling. You've read it four times. Five ingredients. "
        },
        {
          "text": "Eel venom",
          "entity": "eelVenom"
        },
        {
          "text": ", harvested fresh from a living eel. "
        },
        {
          "text": "Bridge-spider silk",
          "entity": "spiderSilk"
        },
        {
          "text": ", from the red-marked spiders under "
        },
        {
          "text": "Grathbone Bridge",
          "entity": "grathbone"
        },
        {
          "text": ". "
        },
        {
          "text": "Phosphite crystal",
          "entity": "phosphite"
        },
        {
          "text": " dust, scraped by hand in the bat-filled "
        },
        {
          "text": "caves",
          "entity": "caves"
        },
        {
          "text": ". "
        },
        {
          "text": "Viper thistle",
          "entity": "thistle"
        },
        {
          "text": " root, fresh from a wind-scoured hillside. "
        },
        {
          "text": "Heartblood mushroom",
          "entity": "mushroom"
        },
        {
          "text": ", cut in the "
        },
        {
          "text": "Underbog",
          "entity": "underbog"
        },
        {
          "text": " where the eels nest.\n\nEvery single one of them might kill you on a good day.\n\nThe "
        },
        {
          "text": "moon-clock",
          "entity": "moonClock"
        },
        {
          "text": " on the wall ticks. Twenty-seven days remain. It sounds like plenty until you remember that the you who usually handles dangerous things is currently sealed in a bottle on the top shelf, glowing cheerfully, beyond all reach.\n\nYou have to start somewhere."
        }
      ],
      "choices": [
        {
          "label": "Spread the recipe flat on the workbench and study each ingredient methodically, noting which can be gathered closest to home and which dangers might be reduced with the right tools or timing.",
          "target": "n0"
        },
        {
          "label": "Bar the door with the iron crossbeam, sit at the workbench alone, and try substituting one of your bottled emotions from the shelf as a stand-in ingredient rather than venturing outside at all.",
          "target": "n1"
        },
        {
          "label": "Pull your satchel over your shoulder and head into Fenwick village to see what Pidge Harrow has in stock at the apothecary, hoping to buy at least one ingredient rather than harvest it yourself.",
          "target": "n2"
        },
        {
          "label": "Run directly to Cull Redmarsh's bottling house and offer him your entire shelf inventory if he will collect the ingredients on your behalf.",
          "target": "n3"
        }
      ]
    }
  },
  "entities": {
    "maren": {
      "title": "MAREN DUSKWELL",
      "category": "Character",
      "body": "You. A bottler witch of thirty-four. Narrow face, gray eyes, hands stained yellow at the fingertips from sulfur work. A burn scar runs along your left forearm. You sell at the Fenwick market, work alone, and as of this morning are missing the part of yourself that used to handle dangerous things."
    },
    "scoria": {
      "title": "SCORIA",
      "category": "Character",
      "body": "Your cat. Black with one white ear and a torn right ear. Yellow eyes. Eight years old, twelve pounds, and entirely without sympathy."
    },
    "thessaly": {
      "title": "THESSALY GRIEVE",
      "category": "Character",
      "body": "Eldest of the Bottlers’ Circle. Seventy-one. Hunched, joint-twisted hands, white hair pinned with fishbone combs. Left eye clouded; right eye sharp. Carries a blackthorn walking stick with a fist-shaped knob."
    },
    "cull": {
      "title": "CULL REDMARSH",
      "category": "Character",
      "body": "Bottler. Heavyset, fifty, red beard whitening at the chin. Wears a leather apron at Circle meetings. Responsible for nearly half the courage sold at market."
    },
    "neave": {
      "title": "NEAVE ASHPOOL",
      "category": "Character",
      "body": "Bottler, forty. Olive skin, angular face, black braid threaded with brass beads. A closed-eye tattoo on the inside of her right wrist. She specializes in grief, extracted from mourners at funerals."
    },
    "pidge": {
      "title": "PIDGE HARROW",
      "category": "Character",
      "body": "Apothecary, sixty. Wire-mended spectacles, limp in his right leg, fingers stained green from copper compounds. Catalogues every transaction in a leather-bound ledger chained to his counter."
    },
    "dorrit": {
      "title": "DORRIT FENN",
      "category": "Character",
      "body": "A girl of twelve. Quick, gap-toothed, freckled. Will run any errand for a penny. Wears a too-large oilskin coat that belonged to her father."

let isMobile = false;
let layout = null;

  currentNode: STORY.rootId,
  visited: new Set([STORY.rootId]),
  decisions: [],     // [{ chapterLabel, label, fromNode, toNode }]

  pressedChoice: null,

  hoveredWikiEntity: null,

  treeView: 'overview',   // 'overview' | 'node:<id>'

let needsTextureUpdate = true;

/* ============================================================================
   RESIZE / DPR
   ============================================================================ */
function resize() {
  DPR = window.devicePixelRatio || 1;
  const cssW = window.innerWidth;
  const cssH = window.innerHeight;
  isMobile = cssW < 768;
  W = Math.round(cssW * DPR);
  H = Math.round(cssH * DPR);
  visibleCanvas.width = W;
  visibleCanvas.height = H;
  visibleCanvas.style.width = cssW + 'px';
  visibleCanvas.style.height = cssH + 'px';
  uiCanvas.width = W;
  uiCanvas.height = H;
  gl.viewport(0, 0, W, H);
  computeLayout();
  _storyLayoutKey = null;  // re-layout the story body at the new region width
  game.storyScroll = 0;    // reset scroll since content reflows
  needsTextureUpdate = true;
}

/* ============================================================================
   LAYOUT — region rectangles in device pixels.
   ============================================================================ */
function computeLayout() {
  const px = (n) => Math.round(n * DPR);
  const inset = px(isMobile ? 8 : 16);
  const screen = { x: inset, y: inset, w: W - 2*inset, h: H - 2*inset };

  const logoH = px(44);
  const menuH = px(44);
  const logoStrip = { x: screen.x, y: screen.y, w: screen.w, h: logoH };
  const menu = { x: screen.x, y: screen.y + logoH, w: screen.w, h: menuH };

  const headerH = px(FS * 2.4);
  const sidePad = px(isMobile ? 12 : 20);
  const contentPadX = px(isMobile ? 16 : 40);

  if (isMobile) {
    // Mobile: bottom bar for secondary nav
    const bottomH = px(40);
    const bottom = { x: screen.x, y: screen.y + screen.h - bottomH, w: screen.w, h: bottomH };

    const playY = screen.y + logoH + menuH;
    const playH = screen.h - logoH - menuH - bottomH;

    // All panels share the same full-width region
    const panelFull = { x: screen.x, y: playY, w: screen.w, h: playH };

    const storyFull = { ...panelFull };
    const story = {
      x: screen.x + contentPadX,
      y: playY + headerH,
      w: screen.w - contentPadX * 2,
      h: playH - headerH - sidePad,
    };

    const storyTreeFull = { ...panelFull };
    const storyTree = {
      x: screen.x + sidePad,
      y: playY + headerH,
      w: screen.w - sidePad * 2,
      h: playH - headerH - sidePad,
    };

    const wikiFull = { ...panelFull };
    const wiki = {
      x: screen.x + sidePad,
      y: playY + headerH,
      w: screen.w - sidePad * 2,
      h: playH - headerH - sidePad,
    };

    layout = { screen, logoStrip, menu, bottom, game: panelFull, storyFull, story,
               diag: panelFull, dividerX: null, storyTreeFull, storyTree, wikiFull, wiki };
  } else {
    // Desktop: side-by-side split
    const playY = screen.y + logoH + menuH;
    const playH = screen.h - logoH - menuH;
    const dividerX = screen.x + Math.round(screen.w * 0.64);

    const game = { x: screen.x, y: playY, w: dividerX - screen.x, h: playH };
    const storyFull = { x: game.x, y: game.y, w: game.w, h: game.h };
    const story = {
      x: game.x + contentPadX,
      y: game.y + headerH,
      w: game.w - contentPadX * 2,
      h: game.h - headerH - sidePad,
    };

    const diag = { x: dividerX, y: playY, w: screen.x + screen.w - dividerX, h: playH };
    const storyTreeH = Math.round(diag.h * 0.6);
    const storyTreeFull = { x: diag.x, y: diag.y, w: diag.w, h: storyTreeH };
    const storyTree = {
      x: diag.x + sidePad,
      y: diag.y + headerH,
      w: diag.w - sidePad * 2,
      h: storyTreeH - headerH - sidePad,
    };
    const wikiFull = { x: diag.x, y: diag.y + storyTreeH, w: diag.w, h: diag.h - storyTreeH };
    const wiki = {
      x: diag.x + sidePad,
      y: diag.y + storyTreeH + headerH,
      w: diag.w - sidePad * 2,
      h: diag.h - storyTreeH - headerH - sidePad,
    };

    layout = { screen, logoStrip, menu, bottom: null, game, storyFull, story,
               diag, dividerX, storyTreeFull, storyTree, wikiFull, wiki };
  }
}

/* ============================================================================
   TEXT RENDERING with typewriter + entity highlighting

   Renders unified segments (story + choices) into a region, word-wrapping.
   Returns hit-test lists for entities and choices.
   ============================================================================ */
function totalCharsInSegments(segments) {
  let n = 0;
  for (const s of segments) n += s.text.length;
  return n;
}

/* Total chars including choices for the unified typewriter stream. */
function totalUnifiedChars(node) {
  const { segments } = buildUnifiedSegments(node);
  return totalCharsInSegments(segments);
}

/* Build unified segments: story content + separator + choice lines + ending.
   Returns { segments, choiceMap }. Each segment may have:
   - entity: entity key (for wiki linking + bold rendering)
   - _choice: choice index (for hit-testing)
   - _choiceCursor: true on the first char of a choice prefix (for > swap)  */
function buildUnifiedSegments(node) {
  const segments = [];
  for (const seg of node.content) segments.push({ ...seg });

  const choiceMap = [];
  let charCount = 0;
  for (const seg of segments) charCount += seg.text.length;

  if (node.choices.length > 0) {
    segments.push({ text: '\n\n' });
    charCount += 2;

    for (let i = 0; i < node.choices.length; i++) {
      const cursorCharIdx = charCount;
      segments.push({ text: ' ', _choice: i, _choiceCursor: true });
      segments.push({ text: ` [${labelOf(i)}]  `, _choice: i });
      const prefixLen = 1 + ` [${labelOf(i)}]  `.length;
      charCount += prefixLen;

      const startCharIdx = cursorCharIdx;
      segments.push({ text: node.choices[i].label, _choice: i });
      charCount += node.choices[i].label.length;
      const endCharIdx = charCount;

      choiceMap.push({ index: i, cursorCharIdx, startCharIdx, endCharIdx, target: node.choices[i].target, label: node.choices[i].label });

      if (i < node.choices.length - 1) {
        segments.push({ text: '\n\n' });
        charCount += 2;
      }
    }
  } else if (node.ending) {
    segments.push({ text: '\n\n' });
    segments.push({ text: 'OUTCOME RECORDED\n' });
    segments.push({ text: node.ending.tag + (node.ending.subtag ? ' / ' + node.ending.subtag : '') });
  }

  return { segments, choiceMap };
}

/* ----------------------------------------------------------------------------
   Terminal-style char layout.

   Pre-compute (x, y) for every character in the unified content based on a
   monospace cell grid. Word-wrap by treating the wrap-space as non-rendering.
   ---------------------------------------------------------------------------- */
function computeCharLayout(ctx, segments, region, fontSize) {
  ctx.font = `${fontSize}px "JetBrains Mono", monospace`;
  const cellW = ctx.measureText('M').width;
  const lineHeight = fontSize * 1.4;
  const maxCols = Math.max(1, Math.floor(region.w / cellW));

  const items = [];
  for (const seg of segments) {
    for (const ch of seg.text) {
      items.push({
        ch,
        entity: seg.entity || null,
        choice: seg._choice ?? null,
        choiceCursor: seg._choiceCursor || false,
      });
    }
  }

  const out = new Array(items.length);
  let col = 0, row = 0;

  for (let i = 0; i < items.length; i++) {
    const it = items[i];

    if (it.ch === '\n') {
      out[i] = { ch: it.ch, entity: it.entity, choice: it.choice, choiceCursor: it.choiceCursor, x: 0, y: 0, render: false };
      col = 0;
      row++;
      continue;
    }

    if (it.ch === ' ') {
      let j = i + 1;
      while (j < items.length && items[j].ch !== ' ' && items[j].ch !== '\n') j++;
      const nextWordLen = j - (i + 1);
      if (col + 1 + nextWordLen > maxCols) {
        out[i] = { ch: it.ch, entity: it.entity, choice: it.choice, choiceCursor: it.choiceCursor, x: 0, y: 0, render: false };
        col = 0;
        row++;
        continue;
      }
    }

    out[i] = {
      ch: it.ch,
      entity: it.entity,
      choice: it.choice,
      choiceCursor: it.choiceCursor,
      x: region.x + col * cellW,
      y: region.y + row * lineHeight,
      render: true,
    };
    col++;
    if (col >= maxCols) { col = 0; row++; }
  }

  return { positions: out, cellW, lineHeight };
}

/* Draw the precomputed layout up to charsRevealed.
   Entity chars rendered in bold (no underlines). Choice cursor char swapped
   to '>' when hovered. Returns entity hit-test rects. */
function renderCharLayout(ctx, charLayout, region, charsRevealed, scrollY, hoveredChoice) {
  scrollY = scrollY || 0;
  const { positions, cellW, lineHeight } = charLayout;
  const fontSize = FS * DPR;
  const fontRegular = `${fontSize}px "JetBrains Mono", monospace`;
  const fontBold = `800 ${fontSize}px "JetBrains Mono", monospace`;
  ctx.font = fontRegular;
  ctx.textBaseline = 'top';
  ctx.textAlign = 'left';
  if ('letterSpacing' in ctx) ctx.letterSpacing = '0px';

  const cap = Math.min(charsRevealed, positions.length);
  const minY = region.y;
  const maxY = region.y + region.h;

  // Pass 1: characters (bold for entities, cursor swap for hovered choice)
  ctx.fillStyle = C.amber;
  let currentBold = false;
  for (let i = 0; i < cap; i++) {
    const p = positions[i];
    if (!p.render) continue;
    const drawY = p.y - scrollY;
    if (drawY + lineHeight < minY || drawY >= maxY) continue;

    const wantBold = !!p.entity;
    if (wantBold !== currentBold) {
      ctx.font = wantBold ? fontBold : fontRegular;
      currentBold = wantBold;
    }

    let ch = p.ch;
    if (p.entity) ch = ch.toUpperCase();
    if (p.choiceCursor && p.choice === hoveredChoice) ch = '>';

    ctx.fillText(ch, p.x, drawY);
  }
  if (currentBold) ctx.font = fontRegular;

  // Pass 2: entity hit-test rects (no underlines — bold is the indicator).
  const entityHits = [];
  let runStart = -1;
  let runEntity = null;
  const flushRun = (endIdx) => {
    if (runStart < 0) return;
    const a = positions[runStart];
    const b = positions[endIdx];
    if (a.render && b.render && a.y === b.y) {
      const drawY = a.y - scrollY;
      const w = (b.x + cellW) - a.x;
      if (drawY + fontSize >= minY && drawY < maxY) {
        entityHits.push({ entity: runEntity, x: a.x, y: drawY, w, h: fontSize });
      }
    }
    runStart = -1; runEntity = null;
  };

  for (let i = 0; i < cap; i++) {
    const p = positions[i];
    if (!p.render) { if (runStart >= 0) flushRun(i - 1); continue; }
    if (!p.entity) { if (runStart >= 0) flushRun(i - 1); continue; }
    if (runStart < 0) { runStart = i; runEntity = p.entity; continue; }
    if (p.entity !== runEntity || p.y !== positions[runStart].y) {
      flushRun(i - 1);
      runStart = i; runEntity = p.entity;
    }
  }
  if (runStart >= 0) flushRun(cap - 1);

  return entityHits;
}

/* Build choice hit-test rects from the char layout + choiceMap. */
function buildChoiceHitRects(charLayout, choiceMap, region, scrollY) {
  const { positions, lineHeight } = charLayout;
  const rects = [];
  for (const cm of choiceMap) {
    let minCY = Infinity, maxCY = -Infinity;
    for (let i = cm.startCharIdx; i < Math.min(cm.endCharIdx, positions.length); i++) {
      const p = positions[i];
      if (p.render) {
        const drawY = p.y - scrollY;
        if (drawY < minCY) minCY = drawY;
        if (drawY > maxCY) maxCY = drawY;
      }
    }
    if (minCY !== Infinity) {
      rects.push({ index: cm.index, x: region.x, y: minCY, w: region.w, h: (maxCY - minCY) + lineHeight, choice: cm });
    }
  }
  return rects;
}

/* ============================================================================
   DRAW: BORDER + MENU
   ============================================================================ */
function drawBorder() {
  const ctx = uiCtx;
  ctx.fillStyle = C.bg;
  ctx.fillRect(0, 0, W, H);

  ctx.strokeStyle = C.amber;
  ctx.lineWidth = BW * DPR;

  // Outer screen rect
  const s = layout.screen;
  ctx.strokeRect(s.x + (BW/2)*DPR, s.y + (BW/2)*DPR, s.w - BW*DPR, s.h - BW*DPR);

  // Helper: draw a stroke line snapped to the BW grid
  const lineY = (x1, y, x2) => {
    ctx.beginPath();
    ctx.moveTo(x1, y);
    ctx.lineTo(x2, y);
    ctx.stroke();
  };
  const lineX = (x, y1, y2) => {
    ctx.beginPath();
    ctx.moveTo(x, y1);
    ctx.lineTo(x, y2);
    ctx.stroke();
  };

  // Horizontal: under logo strip
  lineY(s.x, layout.menu.y, s.x + s.w);
  // Horizontal: under menu strip (top of play area)
  lineY(s.x, layout.menu.y + layout.menu.h, s.x + s.w);

  if (!isMobile) {
    // Desktop: vertical divider between game and diag
    lineX(layout.dividerX, layout.menu.y + layout.menu.h, s.y + s.h);
    // Horizontal: between storyTree and wiki within diag
    lineY(layout.dividerX, layout.wikiFull.y, s.x + s.w);
  } else if (layout.bottom) {
    // Mobile: line above bottom bar
    lineY(s.x, layout.bottom.y, s.x + s.w);
  }
}

function drawMenu() {
  const ctx = uiCtx;
  const r = layout.menu;

  const items = isMobile
    ? ['STORY', 'TREE', 'WIKI']
    : ['STORY', 'PROFILE', 'LIBRARY', 'SETTINGS', 'CONTACT'];
  const activeIdx = isMobile
    ? ['story', 'tree', 'wiki'].indexOf(game.activeView)
    : 0;  // STORY always active on desktop

  ctx.font = `${FS * DPR}px "JetBrains Mono", monospace`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  const navW = r.w;
  const itemW = navW / items.length;
  layout.menuItems = [];

  for (let i = 0; i < items.length; i++) {
    const cx = r.x + itemW * (i + 0.5);
    const cy = r.y + r.h / 2;
    const isHover = game.hoveredMenu === i;
    const isPressed = game.pressedMenu === i;
    const isActive = i === activeIdx;

    if (isPressed || isActive) {
      ctx.fillStyle = C.amber;
      ctx.fillRect(cx - itemW/2 + 6*DPR, r.y + 4*DPR, itemW - 12*DPR, r.h - 8*DPR);
      ctx.fillStyle = C.ink;
    } else if (isHover) {
      ctx.fillStyle = C.amberFaint;
      ctx.fillRect(cx - itemW/2 + 6*DPR, r.y + 4*DPR, itemW - 12*DPR, r.h - 8*DPR);
      ctx.fillStyle = C.amber;
    } else {
      ctx.fillStyle = C.amber;
    }
    ctx.fillText(items[i], cx, cy);
    layout.menuItems.push({ index: i, x: cx - itemW/2, y: r.y, w: itemW, h: r.h, label: items[i] });
  }
}

/* Draw secondary nav at the bottom (mobile only). */
function drawBottomBar() {
  if (!isMobile || !layout.bottom) return;
  const ctx = uiCtx;
  const r = layout.bottom;

  const items = ['PROFILE', 'LIBRARY', 'SETTINGS', 'CONTACT'];
  ctx.font = `${FS * DPR}px "JetBrains Mono", monospace`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  const itemW = r.w / items.length;
  layout.bottomItems = [];

  for (let i = 0; i < items.length; i++) {
    const cx = r.x + itemW * (i + 0.5);
    const cy = r.y + r.h / 2;
    const isHover = game.hoveredBottom === i;

    ctx.fillStyle = isHover ? C.amber : C.amberDim;
    ctx.fillText(items[i], cx, cy);
    layout.bottomItems.push({ index: i, x: cx - itemW/2, y: r.y, w: itemW, h: r.h, label: items[i] });
  }
}
